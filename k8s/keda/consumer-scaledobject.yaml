# consumer-scaledobject.yaml — Step 9c (Phase C substrate). This is the
# SUBSTRATE that the Phase-D demo-keda-kafka.sh will target — it does not
# itself run a demo, it just lands the KEDA core ScaledObject so that
# scale-from-zero-on-lag is wired up before Phase D drives it.
#
# Targets: Deployment notification-service in namespace datamesh
# (k8s/base/notification-service.yaml, step 9b — name/namespace/labels
# copied verbatim from there; scaleTargetRef.kind defaults to Deployment
# and apiVersion defaults to apps/v1, so neither is set explicitly here).
#
# Kafka trigger values, sourced from step 9a:
#   - bootstrapServers: datamesh-kafka-bootstrap.datamesh.svc.cluster.local:9092
#     — Strimzi Kafka CR name "datamesh" in namespace "datamesh"
#     (scripts/setup-kafka-operator.sh: CLUSTER_NAME=datamesh, NS=datamesh
#     -> Strimzi's generated bootstrap Service "<cluster-name>-kafka-bootstrap").
#   - consumerGroup: "notification-service" — notification-service's
#     application.properties does NOT set mp.messaging.incoming.order-placed
#     .group.id explicitly. Per the Quarkus Kafka reference guide ("Consumer
#     group id defaults to the application name as set by the
#     quarkus.application.name configuration property"), and
#     quarkus.application.name=notification-service is set in
#     examples/notification-service/src/main/resources/application.properties,
#     the actual runtime consumer group id is "notification-service". If that
#     default is ever overridden with an explicit group.id, update this value
#     to match or the scaler will watch the wrong (nonexistent) group's lag.
#   - topic: "order.placed" — mp.messaging.incoming.order-placed.topic in the
#     same application.properties (DRQ-010 / DRQ-011).
#   - offsetResetPolicy: earliest — matches the consumer's own
#     auto.offset.reset=earliest so the scaler's lag calculation uses the
#     same starting point as the application.
#
# minReplicaCount: 0 enables scale-from-zero: when notification-service has
# 0 replicas and lag accrues past lagThreshold, KEDA's HPA scales it up.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-scaledobject
  namespace: datamesh
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: datamesh
    app.kubernetes.io/component: consumer
spec:
  scaleTargetRef:
    name: notification-service
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: datamesh-kafka-bootstrap.datamesh.svc.cluster.local:9092
        consumerGroup: notification-service
        topic: order.placed
        lagThreshold: "5"
        offsetResetPolicy: earliest
        allowIdleConsumers: "false"
