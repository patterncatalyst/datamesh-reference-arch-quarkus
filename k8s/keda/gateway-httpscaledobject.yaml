# gateway-httpscaledobject.yaml — part of the minikube substrate. This is the
# substrate that the demo-keda-http.sh demo will target — it does not
# itself run a demo, it just lands the KEDA HTTP add-on's HTTPScaledObject
# so that scale-from-zero-on-request-rate is wired up before the demo drives
# it with load.
#
# Targets: Deployment + Service graphql-gateway in namespace datamesh
# (k8s/base/graphql-gateway.yaml — name/namespace/labels/port
# copied verbatim: Service "graphql-gateway" port "http" = 8080).
#
# Schema is the KEDA HTTP add-on v0.16.0 API (http.keda.sh/v1alpha1,
# kind: HTTPScaledObject) — validated against the CRD the keda-add-ons-http
# 0.16.0 chart renders: hosts, pathPrefixes, scaleTargetRef, replicas, and
# scalingMetric.requestRate{granularity,targetValue,window} all present and
# unchanged. HTTPScaledObject is deprecated in favor of InterceptorRoute
# (0.14.0+) but still served; this repo does not adopt InterceptorRoute yet. scaleTargetRef requires "service" plus exactly one of
# "port"/"portName"; "name"/"kind"/"apiVersion" identify the workload to
# scale (Deployment graphql-gateway, apps/v1).
#
# hosts is set to the in-cluster Service FQDN because this stack has no
# Ingress/external hostname yet — the demo drives load by sending
# requests through the interceptor with this Host header. pathPrefixes
# narrows routing to the actual GraphQL endpoint.
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: graphql-gateway-httpscaledobject
  namespace: datamesh
  labels:
    app.kubernetes.io/name: graphql-gateway
    app.kubernetes.io/part-of: datamesh
    app.kubernetes.io/component: gateway
spec:
  hosts:
    - graphql-gateway.datamesh.svc.cluster.local
  pathPrefixes:
    - /graphql
  scaleTargetRef:
    name: graphql-gateway
    kind: Deployment
    apiVersion: apps/v1
    service: graphql-gateway
    port: 8080
  replicas:
    min: 0
    max: 10
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 50
      window: 1m
