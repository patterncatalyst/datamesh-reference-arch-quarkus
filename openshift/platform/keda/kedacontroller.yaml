# The Custom Metrics Autoscaler operand: KEDA's operator, metrics API server
# and admission webhooks, watching every namespace.
apiVersion: keda.sh/v1alpha1
kind: KedaController
metadata:
  name: keda
  namespace: openshift-keda
spec:
  watchNamespace: ""
  operator:
    logLevel: info
  metricsServer:
    logLevel: "0"
