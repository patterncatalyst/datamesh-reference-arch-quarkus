# OpenShift Service Mesh 3 control plane (Sail operator). Istio is pinned to
# an exact release; OSSM 3.4.3 offers v1.26 to v1.30, not the v1.29.0 that
# minikube runs, so this is the nearest newer one. The Istio CR named
# "default" serves revision "default": pods join with istio.io/rev=default.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    app.kubernetes.io/part-of: datamesh
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-cni
  labels:
    app.kubernetes.io/part-of: datamesh
---
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
spec:
  version: v1.30.5
  namespace: istio-cni
---
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  version: v1.30.5
  namespace: istio-system
  updateStrategy:
    type: InPlace
