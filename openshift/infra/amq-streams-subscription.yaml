# AMQ Streams (Red Hat's build of Strimzi) from the redhat-operators catalog.
#
# Installed into openshift-operators, so the default "global-operators"
# OperatorGroup makes it watch every namespace. The version is pinned:
# installPlanApproval Manual plus startingCSV means OLM proposes exactly this
# CSV and install-infra.sh approves only that InstallPlan. AMQ Streams 3.2
# ships Kafka 4.1 and 4.2; infra/kafka.yaml uses 4.2.0, matching minikube.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: amq-streams
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: datamesh
spec:
  name: amq-streams
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: amq-streams-3.2.x
  startingCSV: amqstreams.v3.2.1-14
  installPlanApproval: Manual
