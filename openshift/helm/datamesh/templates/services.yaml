{{- range $name, $svc := .Values.services }}
{{- if or (not $svc.ai) $.Values.ai.enabled }}
{{- $native := and $.Values.native.enabled (eq $name "order-service") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "datamesh.labels" $ | nindent 4 }}
spec:
  {{- if not (and $.Values.keda.enabled (eq $name "notification-service")) }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: datamesh
        {{- if $.Values.mesh.enabled }}
        istio.io/rev: {{ $.Values.mesh.revision }}
        version: v1
        {{- end }}
      annotations:
        # Roll the pods when the shared env contract changes.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
        {{- if and $.Values.observability.enabled (not $native) }}
        instrumentation.opentelemetry.io/inject-java: "datamesh-java"
        {{- end }}
    spec:
      {{- if $svc.db }}
      # Hibernate connects at boot; without this the service exits once or
      # twice while Postgres initialises. Reuses the service image (bash's
      # /dev/tcp), so nothing extra is pulled.
      initContainers:
        - name: wait-for-postgres
          image: "{{ $.Values.registry }}/{{ $.Release.Namespace }}/{{ $name }}:{{ $.Values.imageTag }}"
          command: ["bash", "-c", "until (exec 3<>/dev/tcp/datamesh-postgres-rw/5432) 2>/dev/null; do echo waiting for datamesh-postgres-rw:5432; sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          {{- include "datamesh.containerSecurity" $ | nindent 10 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- if $native }}
          image: "{{ $.Values.registry }}/{{ $.Release.Namespace }}/{{ $name }}-native:{{ $.Values.imageTag }}"
          # The Avro allow-list is compiled in (build-native.sh): Avro reads it
          # during native-image's build-time class initialisation.
          {{- else }}
          image: "{{ $.Values.registry }}/{{ $.Release.Namespace }}/{{ $name }}:{{ $.Values.imageTag }}"
          {{- end }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            {{- with $svc.grpcPort }}
            - name: grpc
              containerPort: {{ . }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: datamesh-app-config
          env:
            {{- with $svc.avroPackages }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Dorg.apache.avro.SERIALIZABLE_PACKAGES={{ . }}"
            {{- end }}
            {{- if $svc.db }}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: {name: datamesh-postgres-app, key: username}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: datamesh-postgres-app, key: password}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if eq ($svc.probe | default "http") "tcp" }}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          {{- else }}
          startupProbe:
            httpGet: {path: /q/health/started, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /q/health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /q/health/live, port: http}
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- include "datamesh.containerSecurity" $ | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "datamesh.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- with $svc.grpcPort }}
    - name: grpc
      port: {{ . }}
      targetPort: grpc
    {{- end }}
---
{{- end }}
{{- end }}
