{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "datamesh.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: datamesh
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.registry }}/{{ $.Release.Namespace }}/{{ $name }}:{{ $.Values.imageTag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            {{- with $svc.grpcPort }}
            - name: grpc
              containerPort: {{ . }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: datamesh-app-config
          env:
            {{- with $svc.avroPackages }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Dorg.apache.avro.SERIALIZABLE_PACKAGES={{ . }}"
            {{- end }}
            {{- if $svc.db }}
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: {name: datamesh-postgres-app, key: username}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: datamesh-postgres-app, key: password}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          startupProbe:
            httpGet: {path: /q/health/started, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /q/health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /q/health/live, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- include "datamesh.containerSecurity" $ | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "datamesh.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- with $svc.grpcPort }}
    - name: grpc
      port: {{ . }}
      targetPort: grpc
    {{- end }}
---
{{- end }}
