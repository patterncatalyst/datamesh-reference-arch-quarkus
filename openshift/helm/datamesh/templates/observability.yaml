{{- if .Values.observability.enabled }}
# The OpenTelemetry operator injects its Java agent into pods annotated
# instrumentation.opentelemetry.io/inject-java: datamesh-java, appending
# -javaagent to JAVA_TOOL_OPTIONS. Traces only, as in demo-tracing.sh.
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: datamesh-java
  labels:
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  exporter:
    endpoint: http://lgtm:4318
  propagators: [tracecontext, baggage]
  sampler:
    type: always_on
  java:
    env:
      - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
      - {name: OTEL_TRACES_EXPORTER, value: otlp}
      - {name: OTEL_METRICS_EXPORTER, value: none}
      - {name: OTEL_LOGS_EXPORTER, value: none}
      - {name: OTEL_BSP_SCHEDULE_DELAY, value: "1000"}
---
# grafana/otel-lgtm (Collector, Tempo, Loki, Mimir, Grafana in one pod), the
# image the compose stack uses. It owns its data directories as UID 0, so it
# runs under the anyuid SCC through its own ServiceAccount. anyuid allows no
# seccomp profile, so its securityContext sets runAsUser: 0 and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lgtm
  labels:
    {{- include "datamesh.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lgtm-anyuid
  labels:
    {{- include "datamesh.labels" . | nindent 4 }}
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [anyuid]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lgtm-anyuid
  labels:
    {{- include "datamesh.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lgtm-anyuid
subjects:
  - kind: ServiceAccount
    name: lgtm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
        app.kubernetes.io/part-of: datamesh
    spec:
      serviceAccountName: lgtm
      containers:
        - name: lgtm
          image: {{ .Values.observability.lgtmImage }}
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: tempo, containerPort: 3200}
          readinessProbe:
            httpGet: {path: /api/health, port: grafana}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {memory: 2Gi}
          securityContext:
            runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: tempo, port: 3200, targetPort: tempo}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: lgtm
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: lgtm
  port:
    targetPort: grafana
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
