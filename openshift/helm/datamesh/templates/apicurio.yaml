# Apicurio Registry 3.x, in-memory storage, as on minikube
# (scripts/setup-apicurio.sh). The Service is named "apicurio" to match
# APICURIO_REGISTRY_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio-registry
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio-registry
        app.kubernetes.io/part-of: datamesh
    spec:
      containers:
        - name: apicurio
          image: {{ .Values.apicurio.image }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /apis/registry/v3/system/info, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          {{- include "datamesh.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
  labels:
    app.kubernetes.io/name: apicurio-registry
    {{- include "datamesh.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: apicurio-registry
  ports:
    - name: http
      port: 8080
      targetPort: http
