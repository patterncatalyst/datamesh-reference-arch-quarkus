<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">{{ site.brand_emoji | default: "⚛️" }}</span>
      <span>{{ site.title | default: "Tutorial" }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/docs/00-index/' | relative_url }}"
         {% if page.url == '/docs/00-index/' %}aria-current="page"{% endif %}>Contents</a>
      <a href="{{ '/docs/10-summary/' | relative_url }}"
         {% if page.url == '/docs/10-summary/' %}aria-current="page"{% endif %}>Summary</a>
      <a href="{{ '/demos/' | relative_url }}"
         {% if page.url == '/demos/' or page.url == '/setup/' %}aria-current="page"{% endif %}>Demos</a>
      <a href="{{ '/bibliography/' | relative_url }}"
         {% if page.url contains '/bibliography/' %}aria-current="page"{% endif %}>Bibliography</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.github_repo }}"
         rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>
