<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">{{ site.brand_emoji | default: "⚛️" }}</span>
      <span>{{ site.title | default: "Tutorial" }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {%- assign first_doc = site.docs | sort: "order" | first -%}
      <a href="{{ first_doc.url | default: '/' | relative_url }}"
         {% if page.url contains '/docs/' or page.url contains '/parts/' %}aria-current="page"{% endif %}>Tutorial</a>
      <a href="{{ '/setup/' | relative_url }}"
         {% if page.url == '/setup/' %}aria-current="page"{% endif %}>Setup</a>
      <a href="{{ '/demos/' | relative_url }}"
         {% if page.url == '/demos/' %}aria-current="page"{% endif %}>Demos</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.github_repo }}"
         rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>
