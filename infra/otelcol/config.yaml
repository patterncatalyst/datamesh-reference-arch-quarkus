# infra/otelcol/config.yaml
#
# OpenTelemetry Collector configuration for the `lgtm` service in
# compose.yaml (the grafana/otel-lgtm all-in-one image). Mounted at
# /otel-lgtm/otelcol-config.yaml, replacing the image's built-in collector
# config, so this file's `exporters:` target the OTHER backends bundled in
# the SAME container (Tempo/Mimir/Loki all listen on localhost inside that
# one image) — not other compose services.
#
# The exporter names, endpoints and extensions below follow the
# grafana/otel-lgtm:0.36.0 image's OWN shipped default config (`docker run
# --rm --entrypoint cat grafana/otel-lgtm:0.36.0 /otel-lgtm/otelcol-config.yaml`),
# not the generic lgtm-docker-stack skill base config. The image's run-all.sh
# blocks at "Waiting for the OpenTelemetry collector and the Grafana LGTM
# stack to start up..." until every component answers its health URL, so:
#   1. The collector must run the health_check extension on
#      0.0.0.0:13133 with path /ready (run-all.sh polls
#      http://127.0.0.1:13133/ready since otel-lgtm 0.9; 0.8.1 polled
#      Prometheus for otelcol_process_uptime_total instead).
#   2. Traces go to Tempo's OTLP ingest port 4418, NOT Tempo's query API
#      on 3200.
#   3. Metrics go to Prometheus's native OTLP ingest path (/api/v1/otlp),
#      NOT the remote-write path (/api/v1/write).
#   4. Exporters are named otlp_http/<signal>: the image's run-otelcol.sh
#      overlay (OTEL_EXPORTER_OTLP_*_ENDPOINT, OTEL_COLLECTOR_DEBUG_EXPORTER)
#      references exactly these names.
# Backends are addressed as 127.0.0.1, as the image does.
#
# NOTE: the LGTM stack is wired up here as an always-on
# baseline, but no example service emits OTLP yet — Quarkus OTel
# instrumentation lands later. Until then, Grafana will show empty
# application dashboards (the collector's own self-monitoring metrics WILL
# show up, since the stack scrapes itself); that is expected, not a bug.
# Once a service sets OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318,
# data will start flowing through this exact pipeline with no config
# changes needed here.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Self-monitoring: scrape the collector's own Prometheus-format metrics
  # endpoint (every otelcol build exposes one on :8888), as the image does.
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: 'opentelemetry-collector'
          static_configs:
            - targets: ['127.0.0.1:8888']

extensions:
  # run-all.sh polls this endpoint before it reports the stack ready.
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  # memory_limiter is THE most important processor. Without it, a flood of
  # incoming telemetry can OOM-kill the Collector, taking observability
  # offline at the worst possible moment. Always include it first.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # batch reduces export overhead by accumulating spans/metrics/logs into
  # batches before shipping. Default 8192-or-200ms threshold works for a
  # local dev/demo stack.
  batch:
    timeout: 200ms
    send_batch_size: 8192

  # resource attaches service-level metadata to every signal. Useful for
  # filling gaps from poorly-instrumented services.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  # Traces -> Tempo's OTLP ingest port (built into the lgtm image, same
  # container). NOT port 3200 — that's Tempo's query/read API.
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true

  # Metrics -> Prometheus's native OTLP ingest endpoint (built into the
  # lgtm image). NOT /api/v1/write (that's the remote-write exporter's
  # path, a different exporter type).
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true

  # Logs -> Loki (built into the lgtm image)
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true

  # Also export to stdout for debugging during development. Cheap to leave
  # on for a local/demo stack; remove for anything resembling production.
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 100

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/traces, debug]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/metrics, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/logs, debug]
