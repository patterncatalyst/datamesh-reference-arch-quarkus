<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 512" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="512" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Kafka messaging: partitions, consumer groups, replay</text><rect x="40" y="150" width="160" height="76" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="54" y="175" font-size="15" fill="#5a3a0a" text-anchor="start" font-weight="700">Producers</text><text x="54" y="197" font-size="14" fill="#3a3a3a" text-anchor="start">order-service</text><line x1="200" y1="188" x2="260" y2="188" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><text x="230" y="176" font-size="13" fill="#666666" text-anchor="middle" font-style="italic">publish</text><rect x="260" y="56" width="360" height="272" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="276" y="82" font-size="15" fill="#a8331f" text-anchor="start" font-weight="700">Topic order.placed</text><rect x="280" y="96" width="320" height="44" fill="#ffffff" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="440" y="124" font-size="14" fill="#a8331f" text-anchor="middle" font-weight="700">P0</text><rect x="280" y="154" width="320" height="44" fill="#ffffff" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="440" y="182" font-size="14" fill="#a8331f" text-anchor="middle" font-weight="700">P1</text><rect x="280" y="212" width="320" height="44" fill="#ffffff" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="440" y="240" font-size="14" fill="#a8331f" text-anchor="middle" font-weight="700">P2</text><rect x="280" y="270" width="320" height="44" fill="#ffffff" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="440" y="298" font-size="14" fill="#a8331f" text-anchor="middle" font-weight="700">P3</text><rect x="40" y="276" width="160" height="62" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="54" y="301" font-size="15" fill="#7a3a0a" text-anchor="start" font-weight="700">Apicurio</text><text x="54" y="323" font-size="14" fill="#3a3a3a" text-anchor="start">Avro schemas</text><line x1="200" y1="307" x2="260" y2="307" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5 3"/><rect x="760" y="56" width="380" height="190" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="776" y="82" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">Consumer group A</text><rect x="790" y="100" width="320" height="50" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="950" y="131" font-size="14" fill="#2a5a1a" text-anchor="middle" font-weight="700">replica A1 owns P0, P1</text><rect x="790" y="172" width="320" height="50" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="950" y="203" font-size="14" fill="#2a5a1a" text-anchor="middle" font-weight="700">replica A2 owns P2, P3</text><line x1="600" y1="118" x2="790" y2="118" stroke="#5a8a3a" stroke-width="1.4" marker-end="url(#arrG)"/><line x1="600" y1="176" x2="790" y2="140" stroke="#5a8a3a" stroke-width="1.4" marker-end="url(#arrG)"/><line x1="600" y1="234" x2="790" y2="190" stroke="#5a8a3a" stroke-width="1.4" marker-end="url(#arrG)"/><line x1="600" y1="292" x2="790" y2="208" stroke="#5a8a3a" stroke-width="1.4" marker-end="url(#arrG)"/><rect x="760" y="266" width="380" height="100" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="776" y="292" font-size="15" fill="#1a3a6a" text-anchor="start" font-weight="700">Consumer group B</text><rect x="790" y="304" width="320" height="50" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="950" y="335" font-size="14" fill="#1a3a6a" text-anchor="middle" font-weight="700">reads all partitions independently</text><line x1="620" y1="320" x2="790" y2="330" stroke="#2c5aa0" stroke-width="1.4" marker-end="url(#arrB)"/><text x="690" y="354" font-size="13" fill="#666666" text-anchor="middle" font-style="italic">fan-out</text><rect x="40" y="392" width="560" height="76" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="54" y="417" font-size="15" fill="#5a3a0a" text-anchor="start" font-weight="700">Retention and offsets</text><text x="54" y="439" font-size="14" fill="#3a3a3a" text-anchor="start">Events stay after consumption; a consumer</text><text x="54" y="458" font-size="14" fill="#3a3a3a" text-anchor="start">replays from any retained offset.</text><rect x="620" y="392" width="520" height="76" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="634" y="417" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">Scale out</text><text x="634" y="439" font-size="14" fill="#3a3a3a" text-anchor="start">Consumers up to the partition count;</text><text x="634" y="458" font-size="14" fill="#3a3a3a" text-anchor="start">KEDA scales replicas on lag.</text><text x="590" y="496" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Partition and replica counts are illustrative.</text></svg>