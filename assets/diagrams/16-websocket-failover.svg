<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="400" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Replica failure and client reconnect</text><rect x="40" y="52" width="350" height="290" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="56" y="80" font-size="16" fill="#1a3a6a" text-anchor="start" font-weight="700">1  Normal</text><rect x="415" y="52" width="350" height="290" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="431" y="80" font-size="16" fill="#a8331f" text-anchor="start" font-weight="700">2  Replica 2 fails</text><rect x="790" y="52" width="350" height="290" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="806" y="80" font-size="16" fill="#2a5a1a" text-anchor="start" font-weight="700">3  Recover</text><line x1="390" y1="197" x2="415" y2="197" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="765" y1="197" x2="790" y2="197" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="112" width="110" height="40" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="20"/><text x="115" y="136.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="260" y="112" width="110" height="40" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="20"/><text x="315" y="136.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">replica 2</text><line x1="170" y1="124" x2="260" y2="124" stroke="#2c5aa0" stroke-width="1.6" marker-end="url(#arrB)"/><line x1="260" y1="140" x2="170" y2="140" stroke="#5a8a3a" stroke-width="1.6" marker-end="url(#arrG)"/><text x="56" y="200" font-size="14" fill="#3a3a3a" text-anchor="start">Socket open through the Service.</text><text x="56" y="220" font-size="14" fill="#3a3a3a" text-anchor="start">Replica 2 pushes every event</text><text x="56" y="240" font-size="14" fill="#3a3a3a" text-anchor="start">from its own consumer group.</text><rect x="435" y="112" width="110" height="40" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="20"/><text x="490" y="136.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="635" y="112" width="110" height="40" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="20" stroke-dasharray="5 3"/><text x="690" y="137" font-size="14" fill="#a8331f" text-anchor="middle" font-weight="700">replica 2</text><line x1="635" y1="132" x2="545" y2="132" stroke="#c14a3a" stroke-width="1.6" marker-end="url(#arrR)" stroke-dasharray="5 3"/><text x="590" y="120" font-size="13" fill="#666666" text-anchor="middle" font-style="italic">socket closes</text><text x="431" y="200" font-size="14" fill="#3a3a3a" text-anchor="start">Client backs off with jitter:</text><rect x="431" y="218" width="66" height="28" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="14"/><text x="464" y="236.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">1s</text><rect x="511" y="218" width="66" height="28" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="14"/><text x="544" y="236.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">2s</text><rect x="591" y="218" width="66" height="28" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="14"/><text x="624" y="236.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">4s</text><rect x="671" y="218" width="66" height="28" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="14"/><text x="704" y="236.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">...</text><text x="431" y="282" font-size="14" fill="#3a3a3a" text-anchor="start">Delay doubles up to a cap.</text><rect x="810" y="126" width="110" height="40" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="20"/><text x="865" y="150.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="1010" y="96" width="110" height="36" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="18"/><text x="1065" y="118.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">replica 1</text><rect x="1010" y="158" width="110" height="36" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="18"/><text x="1065" y="180.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">replica 3</text><line x1="920" y1="138" x2="1010" y2="114" stroke="#2c5aa0" stroke-width="1.6" marker-end="url(#arrB)"/><line x1="920" y1="154" x2="1010" y2="176" stroke="#2c5aa0" stroke-width="1.6" marker-end="url(#arrB)"/><text x="806" y="216" font-size="14" fill="#3a3a3a" text-anchor="start">Service routes the reconnect to</text><text x="806" y="236" font-size="14" fill="#3a3a3a" text-anchor="start">replica 1 or 3, already receiving</text><text x="806" y="256" font-size="14" fill="#3a3a3a" text-anchor="start">every event via its own push group.</text><text x="806" y="276" font-size="14" fill="#3a3a3a" text-anchor="start">Client re-fetches missed events:</text><text x="806" y="296" font-size="14" fill="#3a3a3a" text-anchor="start">GET /notifications</text><text x="590" y="384" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Client reconnect/backoff is a recommended pattern; WsNotificationClient does not implement it (unverified).</text></svg>