</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Quarkus vs. Spring Boot — same surface, measured on the JVM</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">order-service (Quarkus) vs. its spring-boot-compare twin — REST + Panache/JPA + Kafka/Avro + gRPC, identical on both sides</text><text x="295" y="128" font-size="11" fill="#8a7a5a" text-anchor="middle" font-weight="600">STARTUP TIME (self-reported, seconds)</text><rect x="150" y="321" width="110" height="149" fill="#e8eef7" stroke="#2c5aa0" stroke-width="2" rx="4"/><text x="205" y="309" font-size="13" fill="#1a3a6a" text-anchor="middle" font-weight="700">1.54 s</text><text x="205" y="494" font-size="11" fill="#3a3a3a" text-anchor="middle">order-service</text><text x="205" y="509" font-size="11" fill="#3a3a3a" text-anchor="middle">(Quarkus)</text><rect x="360" y="160" width="110" height="310" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="2" rx="4"/><text x="415" y="148" font-size="13" fill="#4a4a4a" text-anchor="middle" font-weight="700">3.21 s</text><text x="415" y="494" font-size="11" fill="#3a3a3a" text-anchor="middle">spring-boot-compare</text><text x="415" y="509" font-size="11" fill="#3a3a3a" text-anchor="middle">(Spring Boot)</text><text x="880" y="128" font-size="11" fill="#8a7a5a" text-anchor="middle" font-weight="600">RESIDENT MEMORY (RSS, MB)</text><rect x="735" y="273" width="110" height="197" fill="#e8eef7" stroke="#2c5aa0" stroke-width="2" rx="4"/><text x="790" y="261" font-size="13" fill="#1a3a6a" text-anchor="middle" font-weight="700">314 MB</text><text x="790" y="494" font-size="11" fill="#3a3a3a" text-anchor="middle">order-service</text><text x="790" y="509" font-size="11" fill="#3a3a3a" text-anchor="middle">(Quarkus)</text><rect x="945" y="160" width="110" height="310" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="2" rx="4"/><text x="1000" y="148" font-size="13" fill="#4a4a4a" text-anchor="middle" font-weight="700">494 MB</text><text x="1000" y="494" font-size="11" fill="#3a3a3a" text-anchor="middle">spring-boot-compare</text><text x="1000" y="509" font-size="11" fill="#3a3a3a" text-anchor="middle">(Spring Boot)</text><line x1="90" y1="470" x2="520" y2="470" stroke="#9a9a9a" stroke-width="1.5"/><line x1="670" y1="470" x2="1100" y2="470" stroke="#9a9a9a" stroke-width="1.5"/><line x1="595" y1="140" x2="595" y2="510" stroke="#e0ddd4" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="90" y="535" width="1000" height="48" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="110" y="557" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">On this run: Quarkus starts in roughly half the time and boots into roughly two-thirds the resident memory —</text><text x="110" y="575" font-size="10.5" fill="#3a3a3a" text-anchor="start">same REST + Panache/JPA + Kafka/Avro + gRPC surface on both sides. JVM only — no native image either side (see chapter 11).</text><text x="590" y="604" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">JVM, single-run, indicative — captured by scripts/compare-quarkus-springboot.sh on one developer machine, not a rigorous benchmark.</text></svg>