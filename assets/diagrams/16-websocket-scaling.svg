<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="660" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Scaling WebSocket push across replicas — Kafka as the fan-out bus</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">A socket pins a client to one replica; every replica must still see every event</text><rect x="340" y="80" width="500" height="54" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="590" y="104" font-size="13" fill="#a8331f" text-anchor="middle" font-weight="700">orders topic (Kafka)</text><text x="590" y="122" font-size="10" fill="#7a3a2a" text-anchor="middle" font-style="italic">unique group.id per replica = broadcast (NOT a shared load-balanced group)</text><rect x="40" y="220" width="340" height="190" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="56" y="246" font-size="12" fill="#2a5a1a" text-anchor="start" font-weight="700">notification-service · replica 1</text><text x="56" y="270" font-size="10.5" fill="#3a3a3a" text-anchor="start">local OpenConnections registry</text><text x="56" y="285" font-size="10.5" fill="#3a3a3a" text-anchor="start">(this replica's sockets only)</text><rect x="56" y="316" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="129" y="333" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="218" y="316" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="291" y="333" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="56" y="352" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="129" y="369" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><line x1="590" y1="134" x2="210" y2="220" stroke="#5a8a3a" stroke-width="1.4" marker-end="url(#arrG)"/><text x="56" y="402" font-size="9" fill="#5a8a3a" text-anchor="start" font-style="italic">push only to local sockets</text><rect x="420" y="220" width="340" height="190" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="436" y="246" font-size="12" fill="#2a5a1a" text-anchor="start" font-weight="700">notification-service · replica 2</text><text x="436" y="270" font-size="10.5" fill="#3a3a3a" text-anchor="start">local OpenConnections registry</text><text x="436" y="285" font-size="10.5" fill="#3a3a3a" text-anchor="start">(this replica's sockets only)</text><rect x="436" y="316" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="509" y="333" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="598" y="316" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="671" y="333" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="436" y="352" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="509" y="369" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><line x1="590" y1="134" x2="590" y2="220" stroke="#5a8a3a" stroke-width="1.4" marker-end="url(#arrG)"/><text x="436" y="402" font-size="9" fill="#5a8a3a" text-anchor="start" font-style="italic">push only to local sockets</text><rect x="800" y="220" width="340" height="190" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="816" y="246" font-size="12" fill="#2a5a1a" text-anchor="start" font-weight="700">notification-service · replica 3</text><text x="816" y="270" font-size="10.5" fill="#3a3a3a" text-anchor="start">local OpenConnections registry</text><text x="816" y="285" font-size="10.5" fill="#3a3a3a" text-anchor="start">(this replica's sockets only)</text><rect x="816" y="316" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="889" y="333" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="978" y="316" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="1051" y="333" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><rect x="816" y="352" width="146" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="889" y="369" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">client</text><line x1="590" y1="134" x2="970" y2="220" stroke="#5a8a3a" stroke-width="1.4" marker-end="url(#arrG)"/><text x="816" y="402" font-size="9" fill="#5a8a3a" text-anchor="start" font-style="italic">push only to local sockets</text><rect x="40" y="450" width="1100" height="56" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="56" y="473" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">KEDA scales on consumer lag (minReplicaCount: 0)</text><text x="56" y="493" font-size="10" fill="#5a3a0a" text-anchor="start">a replica holding live sockets but zero lag can scale to zero and drop clients — use a connection-aware trigger, graceful drain, or minReplicaCount: 1 (not implemented here).</text><rect x="40" y="530" width="1100" height="46" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="558" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">Kafka is the fan-out bus — any instance can serve any client; no distributed connection registry needed</text><text x="590" y="644" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">What the repo runs today is single-instance; the per-replica broadcast fan-out above is the recommended scaled pattern, not deployed.</text></svg>