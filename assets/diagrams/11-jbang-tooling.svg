</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">JBang: run a single .java file, no project</text><rect x="40" y="70" width="300" height="124" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="190" y="116" font-size="15" fill="#5a3a0a" text-anchor="middle" font-weight="700">Single .java file</text><text x="190" y="137" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">//JAVA 25+</text><text x="190" y="158" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">//DEPS group:artifact:version</text><rect x="390" y="70" width="170" height="124" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="475" y="126" font-size="14" fill="#7a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">jbang</text><text x="475" y="147" font-size="14" fill="#3a3a3a" text-anchor="middle">compile and run</text><rect x="610" y="70" width="280" height="124" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="750" y="116" font-size="15" fill="#1a3a6a" text-anchor="middle" font-weight="700">Resolve</text><text x="750" y="137" font-size="14" fill="#3a3a3a" text-anchor="middle">Dependencies from Maven Central</text><text x="750" y="158" font-size="14" fill="#3a3a3a" text-anchor="middle">Downloads a JDK if missing</text><rect x="940" y="70" width="200" height="124" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="1040" y="116" font-size="15" fill="#2a5a1a" text-anchor="middle" font-weight="700">Cache</text><text x="1040" y="137" font-size="14" fill="#3a3a3a" text-anchor="middle">Build is cached;</text><text x="1040" y="158" font-size="14" fill="#3a3a3a" text-anchor="middle">later runs start fast</text><line x1="340" y1="132" x2="390" y2="132" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="560" y1="132" x2="610" y2="132" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="890" y1="132" x2="940" y2="132" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="226" width="1100" height="150" fill="#fdfcfa" stroke="#9a9a9a" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="56" y="252" font-size="16" fill="#4a4a4a" text-anchor="start" font-weight="700">Used in this project</text><rect x="60" y="270" width="252" height="84" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="186" y="296" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">HelloRoute.java</text><text x="186" y="316" font-size="14" fill="#3a3a3a" text-anchor="middle">Camel route prototype, run via</text><text x="186" y="336" font-size="14" fill="#3a3a3a" text-anchor="middle">camel@apache/camel</text><rect x="326" y="270" width="252" height="84" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="452" y="296" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">WsNotificationClient.java</text><text x="452" y="316" font-size="14" fill="#3a3a3a" text-anchor="middle">WebSocket client for</text><text x="452" y="336" font-size="14" fill="#3a3a3a" text-anchor="middle">the push demo</text><rect x="592" y="270" width="252" height="84" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="718" y="296" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">PanamaFfm.java</text><text x="718" y="316" font-size="14" fill="#3a3a3a" text-anchor="middle">Foreign Function &amp; Memory</text><text x="718" y="336" font-size="14" fill="#3a3a3a" text-anchor="middle">calls into libc</text><rect x="858" y="270" width="252" height="84" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="984" y="296" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">App catalog</text><text x="984" y="316" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">camel@apache/camel</text><text x="984" y="336" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">quarkus@quarkusio</text></svg>