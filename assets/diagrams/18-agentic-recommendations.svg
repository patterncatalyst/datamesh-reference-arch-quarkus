<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="620" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">A plan / execute / validate relay, grounded in MCP tooling</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">Route each phase to the model tier that fits it — and verify the result independently</text><rect x="60" y="100" width="300" height="130" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="76" y="126" font-size="13.5" fill="#a8331f" text-anchor="start" font-weight="700">PLAN — Opus</text><text x="76" y="150" font-size="11" fill="#3a3a3a" text-anchor="start">decompose the work,</text><text x="76" y="166" font-size="11" fill="#3a3a3a" text-anchor="start">pick the approach,</text><text x="76" y="182" font-size="11" fill="#3a3a3a" text-anchor="start">define acceptance criteria</text><rect x="440" y="100" width="300" height="130" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="456" y="126" font-size="13.5" fill="#2a5a1a" text-anchor="start" font-weight="700">EXECUTE — Sonnet</text><text x="456" y="150" font-size="11" fill="#3a3a3a" text-anchor="start">one agent per file-disjoint</text><text x="456" y="166" font-size="11" fill="#3a3a3a" text-anchor="start">step, fanned out in parallel,</text><text x="456" y="182" font-size="11" fill="#3a3a3a" text-anchor="start">checkpoint-commit each</text><rect x="820" y="100" width="300" height="130" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="836" y="126" font-size="13.5" fill="#a8331f" text-anchor="start" font-weight="700">VALIDATE — Opus</text><text x="836" y="150" font-size="11" fill="#3a3a3a" text-anchor="start">reads the real diff, runs</text><text x="836" y="166" font-size="11" fill="#3a3a3a" text-anchor="start">the real build — not the</text><text x="836" y="182" font-size="11" fill="#3a3a3a" text-anchor="start">executor's self-report</text><line x1="360" y1="165" x2="440" y2="165" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="740" y1="165" x2="820" y2="165" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="970" y1="230" x2="590" y2="266" stroke="#c14a3a" stroke-width="1.5" marker-end="url(#arrR)" stroke-dasharray="5 3"/><text x="820" y="282" font-size="10" fill="#a8331f" text-anchor="middle" font-weight="700" font-style="italic">repair round (capped at 2)</text><rect x="60" y="360" width="480" height="90" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="76" y="386" font-size="13.5" fill="#1a3a6a" text-anchor="start" font-weight="700">camel-mcp</text><text x="76" y="410" font-size="11" fill="#3a3a3a" text-anchor="start">catalog lookups, route validation, runtime introspection</text><text x="76" y="426" font-size="11" fill="#3a3a3a" text-anchor="start">— don't guess Camel component/EIP syntax</text><rect x="640" y="360" width="480" height="90" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="656" y="386" font-size="13.5" fill="#7a3a0a" text-anchor="start" font-weight="700">quarkus-agent</text><text x="656" y="410" font-size="11" fill="#3a3a3a" text-anchor="start">quarkus_searchDocs / quarkus_skills / quarkus_logs</text><text x="656" y="426" font-size="11" fill="#3a3a3a" text-anchor="start">— version-matched patterns, not recalled guesses</text><text x="590" y="346" font-size="10" fill="#8a7a5a" text-anchor="middle" font-weight="700">GROUND EVERY EXECUTOR IN REAL TOOLING</text><rect x="60" y="480" width="1060" height="46" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="508" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">A subagent's report is a claim, not evidence — the value is the independent verification</text><text x="590" y="604" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Guardrails: Conventional Commits, no attribution trailers, scope discipline, explicit model tier on every nested agent call.</text></svg>