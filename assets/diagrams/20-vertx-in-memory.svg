<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 492" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="492" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Vert.x in-memory messaging inside one JVM</text><rect x="40" y="50" width="1100" height="296" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="56" y="76" font-size="16" fill="#5a3a0a" text-anchor="start" font-weight="700">One JVM</text><rect x="70" y="96" width="250" height="140" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="84" y="121" font-size="15" fill="#5a3a0a" text-anchor="start" font-weight="700">Producers</text><text x="84" y="143" font-size="14" fill="#3a3a3a" text-anchor="start">Emitter</text><text x="84" y="162" font-size="14" fill="#3a3a3a" text-anchor="start">@Outgoing methods</text><rect x="420" y="96" width="340" height="140" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="436" y="121" font-size="15" fill="#1a3a6a" text-anchor="start" font-weight="700">Vert.x event bus</text><rect x="436" y="134" width="308" height="28" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="14"/><text x="590" y="152.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">send: one consumer</text><rect x="436" y="166" width="308" height="28" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="14"/><text x="590" y="184.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">publish: all consumers</text><rect x="436" y="198" width="308" height="28" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="14"/><text x="590" y="216.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">request-reply</text><rect x="860" y="96" width="250" height="140" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="874" y="121" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">Consumers</text><text x="874" y="143" font-size="14" fill="#3a3a3a" text-anchor="start">@Incoming methods</text><text x="874" y="162" font-size="14" fill="#3a3a3a" text-anchor="start">@ConsumeEvent</text><line x1="320" y1="166" x2="420" y2="166" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="760" y1="166" x2="860" y2="166" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="70" y="262" width="500" height="68" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="84" y="287" font-size="15" fill="#4a4a4a" text-anchor="start" font-weight="700">Event-loop threads (about 2 x cores)</text><text x="84" y="309" font-size="14" fill="#3a3a3a" text-anchor="start">Non-blocking handlers</text><rect x="590" y="262" width="520" height="68" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="604" y="287" font-size="15" fill="#4a4a4a" text-anchor="start" font-weight="700">Worker pool</text><text x="604" y="309" font-size="14" fill="#3a3a3a" text-anchor="start">Blocking handlers</text><rect x="40" y="366" width="540" height="76" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="54" y="391" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">Scales up with cores</text><text x="54" y="413" font-size="14" fill="#3a3a3a" text-anchor="start">No network hop or wire serialization;</text><text x="54" y="432" font-size="14" fill="#3a3a3a" text-anchor="start">back-pressure via Mutiny.</text><rect x="600" y="366" width="540" height="76" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="614" y="391" font-size="15" fill="#a8331f" text-anchor="start" font-weight="700">Limits</text><text x="614" y="413" font-size="14" fill="#3a3a3a" text-anchor="start">One JVM, not durable, no replay.</text><text x="590" y="476" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">This project uses the in-memory connector in shipping-service tests; event-bus usage shown is illustrative.</text></svg>