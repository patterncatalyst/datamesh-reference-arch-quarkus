<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="520" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">OIDC bearer-token flow: Dev Services Keycloak and review-service</text><rect x="40" y="150" width="220" height="180" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="150" y="224" font-size="15" fill="#1a3a6a" text-anchor="middle" font-weight="700">Client</text><text x="150" y="245" font-size="14" fill="#3a3a3a" text-anchor="middle">demo-oidc.sh (curl)</text><text x="150" y="266" font-size="14" fill="#3a3a3a" text-anchor="middle">acts as alice or bob</text><rect x="470" y="80" width="280" height="150" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="610" y="118" font-size="15" fill="#7a3a0a" text-anchor="middle" font-weight="700">Keycloak (Dev Services)</text><text x="610" y="139" font-size="14" fill="#3a3a3a" text-anchor="middle">realm quarkus, client quarkus-app</text><text x="610" y="160" font-size="14" fill="#3a3a3a" text-anchor="middle">alice: admin + user</text><text x="610" y="181" font-size="14" fill="#3a3a3a" text-anchor="middle">bob: user</text><text x="610" y="202" font-size="14" fill="#3a3a3a" text-anchor="middle">sets auth-server-url</text><rect x="920" y="150" width="230" height="180" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="1035" y="213" font-size="15" fill="#a8331f" text-anchor="middle" font-weight="700">review-service</text><text x="1035" y="234" font-size="14" fill="#3a3a3a" text-anchor="middle">quarkus-oidc verifies</text><text x="1035" y="255" font-size="14" fill="#3a3a3a" text-anchor="middle">signature, issuer, expiry</text><text x="1035" y="276" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">@RolesAllowed("admin")</text><line x1="260" y1="190" x2="470" y2="190" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><text x="365" y="180" font-size="14" fill="#666666" text-anchor="middle" font-style="italic">1  POST token endpoint</text><line x1="470" y1="215" x2="260" y2="215" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><text x="365" y="238" font-size="14" fill="#666666" text-anchor="middle" font-style="italic">2  JWT access token</text><line x1="260" y1="300" x2="920" y2="300" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><text x="590" y="290" font-size="14" fill="#666666" text-anchor="middle" font-style="italic">3  DELETE /reviews/{id} with Authorization: Bearer &lt;jwt&gt;</text><line x1="920" y1="190" x2="750" y2="190" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><text x="835" y="180" font-size="14" fill="#666666" text-anchor="middle" font-style="italic">4  fetch JWKS</text><rect x="40" y="360" width="1110" height="110" fill="#fdfcfa" stroke="#c19a6b" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="56" y="386" font-size="16" fill="#5a3a0a" text-anchor="start" font-weight="700">Outcomes of DELETE /reviews/{id}</text><rect x="60" y="394" width="340" height="56" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="230" y="416" font-size="15" fill="#a8331f" text-anchor="middle" font-weight="700">No token</text><text x="230" y="436" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">401</text><rect x="420" y="394" width="340" height="56" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="590" y="416" font-size="15" fill="#a8331f" text-anchor="middle" font-weight="700">bob (user)</text><text x="590" y="436" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">403</text><rect x="780" y="394" width="350" height="56" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="955" y="416" font-size="15" fill="#2a5a1a" text-anchor="middle" font-weight="700">alice (admin)</text><text x="955" y="436" font-size="14" fill="#3a3a3a" text-anchor="middle">204, then GET returns 404</text><line x1="1035" y1="330" x2="1035" y2="360" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><text x="590" y="500" font-size="14" fill="#6a5a3a" text-anchor="middle" font-style="italic">Password grant for the demo only; browser apps use the authorization code flow.</text></svg>