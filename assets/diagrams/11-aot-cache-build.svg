<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="540" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">How compare-quarkus-springboot.sh --aot builds and uses the JDK 25 AOT cache</text><rect x="40" y="70" width="220" height="116" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="150" y="112" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">mvn package</text><text x="150" y="133" font-size="14" fill="#3a3a3a" text-anchor="middle">target/quarkus-app/</text><text x="150" y="154" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">quarkus-run.jar</text><rect x="300" y="70" width="400" height="116" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="500" y="101" font-size="15" fill="#7a3a0a" text-anchor="middle" font-weight="700">Training run</text><text x="500" y="122" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">-XX:AOTCacheOutput=order-service.aot</text><text x="500" y="143" font-size="14" fill="#3a3a3a" text-anchor="middle">wait for the started line, then SIGTERM</text><text x="500" y="164" font-size="14" fill="#3a3a3a" text-anchor="middle">cache is written when the JVM exits</text><rect x="740" y="70" width="400" height="116" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="940" y="101" font-size="14" fill="#2a5a1a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">order-service.aot</text><text x="940" y="122" font-size="14" fill="#3a3a3a" text-anchor="middle">classes loaded and linked (JEP 483)</text><text x="940" y="143" font-size="14" fill="#3a3a3a" text-anchor="middle">method profiles (JEP 515)</text><text x="940" y="164" font-size="14" fill="#3a3a3a" text-anchor="middle">103 MB</text><line x1="260" y1="128" x2="300" y2="128" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="700" y1="128" x2="740" y2="128" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="236" width="220" height="116" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="150" y="268" font-size="15" fill="#4a4a4a" text-anchor="middle" font-weight="700">Measured</text><text x="150" y="288" font-size="14" fill="#3a3a3a" text-anchor="middle">Temurin 25.0.3</text><text x="150" y="308" font-size="14" fill="#3a3a3a" text-anchor="middle">2026-10-05</text><text x="150" y="328" font-size="14" fill="#3a3a3a" text-anchor="middle">single run</text><rect x="300" y="236" width="400" height="116" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="500" y="278" font-size="15" fill="#2a5a1a" text-anchor="middle" font-weight="700">Started in 0.992 s</text><text x="500" y="299" font-size="14" fill="#3a3a3a" text-anchor="middle">2.045 s on the plain JVM</text><text x="500" y="320" font-size="14" fill="#3a3a3a" text-anchor="middle">same jar, full JVM, JIT active</text><rect x="740" y="236" width="400" height="116" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="940" y="267" font-size="15" fill="#1a3a6a" text-anchor="middle" font-weight="700">Production run</text><text x="940" y="288" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">-XX:AOTCache=order-service.aot</text><text x="940" y="309" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">-XX:AOTMode=on</text><text x="940" y="330" font-size="14" fill="#3a3a3a" text-anchor="middle">same jar, JDK, and flags</text><line x1="940" y1="186" x2="940" y2="236" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="740" y1="294" x2="700" y2="294" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="382" width="1100" height="130" fill="#fdfcfa" stroke="#9a9a9a" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="56" y="408" font-size="16" fill="#4a4a4a" text-anchor="start" font-weight="700">Rules the script enforces</text><rect x="60" y="420" width="344" height="76" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="232" y="452" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">Same JDK, classpath, flags</text><text x="232" y="472" font-size="14" fill="#3a3a3a" text-anchor="middle">for training and production</text><rect x="418" y="420" width="344" height="76" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="590" y="442" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">-XX:AOTMode=on</text><text x="590" y="462" font-size="14" fill="#3a3a3a" text-anchor="middle">a stale cache stops startup</text><text x="590" y="482" font-size="14" fill="#3a3a3a" text-anchor="middle">instead of being ignored</text><rect x="776" y="420" width="344" height="76" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="948" y="442" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">Spring Boot: extract first</text><text x="948" y="462" font-size="14" fill="#3a3a3a" text-anchor="middle">nested jars cannot be cached</text><text x="948" y="482" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">-Djarmode=tools extract</text></svg>