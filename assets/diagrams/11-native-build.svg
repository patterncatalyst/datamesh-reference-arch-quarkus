</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">How demo-native.sh builds order-service as a native executable</text><rect x="40" y="70" width="220" height="116" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="150" y="122" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">mvn package -Pnative</text><text x="150" y="143" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">-pl order-service -am</text><rect x="300" y="70" width="270" height="116" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="435" y="101" font-size="15" fill="#1a3a6a" text-anchor="middle" font-weight="700">Quarkus build</text><text x="435" y="122" font-size="14" fill="#3a3a3a" text-anchor="middle">extensions run build steps</text><text x="435" y="143" font-size="14" fill="#3a3a3a" text-anchor="middle">reflection, resources registered</text><text x="435" y="164" font-size="14" fill="#3a3a3a" text-anchor="middle">classes initialized at build</text><rect x="610" y="70" width="250" height="116" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="735" y="101" font-size="14" fill="#7a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">native-image</text><text x="735" y="122" font-size="14" fill="#3a3a3a" text-anchor="middle">points-to analysis</text><text x="735" y="143" font-size="14" fill="#3a3a3a" text-anchor="middle">heap snapshot</text><text x="735" y="164" font-size="14" fill="#3a3a3a" text-anchor="middle">compiles reachable code</text><rect x="900" y="70" width="240" height="116" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="1020" y="112" font-size="15" fill="#2a5a1a" text-anchor="middle" font-weight="700">Native executable</text><text x="1020" y="133" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">order-service-…-runner</text><text x="1020" y="154" font-size="14" fill="#3a3a3a" text-anchor="middle">141 MB, no JVM, no JIT</text><line x1="260" y1="128" x2="300" y2="128" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="570" y1="128" x2="610" y2="128" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="860" y1="128" x2="900" y2="128" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="226" width="220" height="120" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="150" y="260" font-size="15" fill="#4a4a4a" text-anchor="middle" font-weight="700">Neither found</text><text x="150" y="280" font-size="14" fill="#3a3a3a" text-anchor="middle">the demo fails; it never</text><text x="150" y="300" font-size="14" fill="#3a3a3a" text-anchor="middle">builds a JVM jar and</text><text x="150" y="320" font-size="14" fill="#3a3a3a" text-anchor="middle">calls it native</text><rect x="300" y="226" width="840" height="120" fill="#fdfcfa" stroke="#c97a3a" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="316" y="252" font-size="16" fill="#7a3a0a" text-anchor="start" font-weight="700">Where native-image comes from</text><rect x="320" y="264" width="390" height="68" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="515" y="292" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">Local GraalVM or Mandrel</text><text x="515" y="312" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">native-image on PATH or $GRAALVM_HOME</text><rect x="730" y="264" width="390" height="68" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="925" y="292" font-size="14" fill="#7a3a0a" text-anchor="middle" font-weight="700">Mandrel builder container (used here)</text><text x="925" y="312" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">quarkus.native.container-build=true</text><line x1="735" y1="264" x2="735" y2="186" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="376" width="1100" height="120" fill="#fdfcfa" stroke="#5a8a3a" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="56" y="402" font-size="16" fill="#2a5a1a" text-anchor="start" font-weight="700">Run: native mode gets no Dev Services</text><rect x="60" y="414" width="260" height="62" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="190" y="439" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">demo-native.sh</text><text x="190" y="459" font-size="14" fill="#3a3a3a" text-anchor="middle">asserts a JSON array</text><rect x="460" y="414" width="260" height="62" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="590" y="439" font-size="14" fill="#2a5a1a" text-anchor="middle" font-weight="700">Native binary</text><text x="590" y="459" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">TZ=UTC, JDBC_URL=…</text><rect x="860" y="414" width="260" height="62" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="990" y="439" font-size="14" fill="#4a4a4a" text-anchor="middle" font-weight="700">Postgres 18.6</text><text x="990" y="459" font-size="14" fill="#3a3a3a" text-anchor="middle">throwaway container</text><line x1="320" y1="445" x2="460" y2="445" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><text x="390" y="435" font-size="14" fill="#666666" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">GET /orders</text><line x1="720" y1="445" x2="860" y2="445" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><text x="790" y="435" font-size="14" fill="#666666" text-anchor="middle" font-style="italic">JDBC</text><rect x="40" y="516" width="1100" height="56" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="590" y="550" font-size="15" fill="#5a3a0a" text-anchor="middle" font-weight="700">Measured 2026-10-06: Mandrel container build 136 s · 141 MB binary · started in 0.081 s</text></svg>