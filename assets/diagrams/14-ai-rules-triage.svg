<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="560" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">AI-assisted triage — Ollama classifies, Drools decides</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">One classify → decide core, driven two ways: a Camel route and a Quarkus Flow workflow</text><rect x="40" y="90" width="230" height="80" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="155" y="114" font-size="13" fill="#5a3a0a" text-anchor="middle" font-weight="700">Order</text><text x="56" y="134" font-size="9.5" fill="#3a3a3a" text-anchor="start">OrderCreate: customerId,</text><text x="56" y="147" font-size="9.5" fill="#3a3a3a" text-anchor="start">itemSku, quantity, amount</text><rect x="330" y="90" width="230" height="80" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="445" y="114" font-size="12.5" fill="#1a3a6a" text-anchor="middle" font-weight="700">Classify (Ollama)</text><text x="346" y="134" font-size="9.5" fill="#3a3a3a" text-anchor="start">langchain4j ChatModel.chat()</text><text x="346" y="147" font-size="9.5" fill="#3a3a3a" text-anchor="start">qwen2.5:3b, JSON response mode</text><rect x="620" y="90" width="230" height="80" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="735" y="114" font-size="12.5" fill="#2a5a1a" text-anchor="middle" font-weight="700">Decide (Drools)</text><text x="636" y="134" font-size="9" fill="#3a3a3a" text-anchor="start">KieSession fires order-triage.drl</text><text x="636" y="147" font-size="9" fill="#3a3a3a" text-anchor="start">FRAUD_HOLD / EXPEDITE / ROUTE_TO_WAREHOUSE</text><rect x="910" y="90" width="230" height="80" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="1025" y="114" font-size="12.5" fill="#a8331f" text-anchor="middle" font-weight="700">TriageDecision</text><text x="926" y="134" font-size="9.5" fill="#3a3a3a" text-anchor="start">decision + reason +</text><text x="926" y="147" font-size="9.5" fill="#3a3a3a" text-anchor="start">classified fields</text><line x1="270" y1="130" x2="330" y2="130" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="560" y1="130" x2="620" y2="130" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="850" y1="130" x2="910" y2="130" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="420" y="236" width="340" height="26" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="590" y="253" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">SAME TriageService.classify / .decide</text><line x1="445" y1="170" x2="490" y2="236" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="4 3"/><line x1="735" y1="170" x2="690" y2="236" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="4 3"/><line x1="310" y1="320" x2="500" y2="264" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="4 3"/><line x1="870" y1="320" x2="680" y2="264" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="4 3"/><rect x="70" y="320" width="480" height="110" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="86" y="346" font-size="12" fill="#1a3a6a" text-anchor="start" font-weight="700">Camel orchestration — OrderTriageRoute</text><text x="86" y="368" font-size="10.5" fill="#3a3a3a" text-anchor="start">POST /api/orders/triage</text><text x="86" y="385" font-size="10.5" fill="#3a3a3a" text-anchor="start">unmarshal → classify → decide → marshal (imperative)</text><rect x="630" y="320" width="480" height="110" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="646" y="346" font-size="12" fill="#2a5a1a" text-anchor="start" font-weight="700">Quarkus Flow orchestration — OrderTriageWorkflow</text><text x="646" y="368" font-size="10.5" fill="#3a3a3a" text-anchor="start">POST /api/orders/triage-flow</text><text x="646" y="385" font-size="10.5" fill="#3a3a3a" text-anchor="start">FlowDSL.function(classify), function(decide) (declarative)</text><rect x="70" y="460" width="1040" height="60" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="90" y="486" font-size="10.5" fill="#5a3a0a" text-anchor="start" font-weight="700">ORDER-TRIAGE.DRL — three mutually exclusive, salience-ordered rules:</text><text x="90" y="506" font-size="10" fill="#3a3a3a" text-anchor="start">FRAUD_HOLD (riskSignal == HIGH) · EXPEDITE (amount ≥ 1000 and riskSignal == LOW) · ROUTE_TO_WAREHOUSE (default)</text><text x="590" y="544" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">The LLM's job ends at classification; from there the decision is a deterministic, auditable function of those fields — the model never decides.</text></svg>