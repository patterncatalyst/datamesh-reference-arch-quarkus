</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">In-memory (Vert.x) vs. Kafka: same code, different transport</text><rect x="240" y="54" width="445" height="42" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="462.5" y="81" font-size="16" fill="#2a5a1a" text-anchor="middle" font-weight="700">In-memory / Vert.x (one JVM)</text><rect x="695" y="54" width="445" height="42" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="917.5" y="81" font-size="16" fill="#a8331f" text-anchor="middle" font-weight="700">Kafka (cluster)</text><rect x="40" y="104" width="190" height="46" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="132" font-size="15" fill="#4a4a4a" text-anchor="start" font-weight="700">Scope</text><rect x="240" y="104" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="254" y="132" font-size="14" fill="#3a3a3a" text-anchor="start">One JVM, in-process</text><rect x="695" y="104" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="709" y="132" font-size="14" fill="#3a3a3a" text-anchor="start">Across services, over the network</text><rect x="40" y="155" width="190" height="46" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="183" font-size="15" fill="#4a4a4a" text-anchor="start" font-weight="700">Durability</text><rect x="240" y="155" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="254" y="183" font-size="14" fill="#3a3a3a" text-anchor="start">Memory only, no retention</text><rect x="695" y="155" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="709" y="183" font-size="14" fill="#3a3a3a" text-anchor="start">Retained on disk, replicated</text><rect x="40" y="206" width="190" height="46" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="234" font-size="15" fill="#4a4a4a" text-anchor="start" font-weight="700">Ordering</text><rect x="240" y="206" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="254" y="234" font-size="14" fill="#3a3a3a" text-anchor="start">Emission order, single stream</text><rect x="695" y="206" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="709" y="234" font-size="14" fill="#3a3a3a" text-anchor="start">Per partition, by record key</text><rect x="40" y="257" width="190" height="46" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="285" font-size="15" fill="#4a4a4a" text-anchor="start" font-weight="700">How it scales</text><rect x="240" y="257" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="254" y="285" font-size="14" fill="#3a3a3a" text-anchor="start">Up: across cores in one JVM</text><rect x="695" y="257" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="709" y="285" font-size="14" fill="#3a3a3a" text-anchor="start">Out: partitions and replicas</text><rect x="40" y="308" width="190" height="46" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="336" font-size="15" fill="#4a4a4a" text-anchor="start" font-weight="700">Failure</text><rect x="240" y="308" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="254" y="336" font-size="14" fill="#3a3a3a" text-anchor="start">Messages lost with the process</text><rect x="695" y="308" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="709" y="336" font-size="14" fill="#3a3a3a" text-anchor="start">Consumer replays from its offset</text><rect x="40" y="359" width="190" height="46" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="387" font-size="15" fill="#4a4a4a" text-anchor="start" font-weight="700">Use here</text><rect x="240" y="359" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="254" y="387" font-size="14" fill="#3a3a3a" text-anchor="start">Tests</text><rect x="695" y="359" width="445" height="46" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="709" y="387" font-size="14" fill="#3a3a3a" text-anchor="start">%prod</text><rect x="40" y="416" width="1100" height="40" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="440.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Same @Incoming/@Outgoing code; only the connector config changes.</text><text x="590" y="484" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Qualitative comparison of how this project wires each connector; not benchmarked.</text></svg>