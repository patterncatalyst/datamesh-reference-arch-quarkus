<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="600" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">In-memory connector vs. Kafka — same code, different transport</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">The @Incoming/@Outgoing methods never change; only the connector config does</text><rect x="60" y="100" width="460" height="220" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="76" y="126" font-size="13" fill="#2a5a1a" text-anchor="start" font-weight="700">In-memory connector (tests)</text><rect x="90" y="150" width="400" height="140" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="290" y="174" font-size="11" fill="#5a8a3a" text-anchor="middle" font-style="italic">one JVM</text><rect x="120" y="192" width="340" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="290" y="209" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">@Outgoing producer</text><rect x="120" y="240" width="340" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="290" y="257" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">@Incoming consumer</text><line x1="290" y1="218" x2="290" y2="240" stroke="#5a8a3a" stroke-width="1.4" marker-end="url(#arrG)"/><text x="290" y="312" font-size="10" fill="#2a5a1a" text-anchor="middle" font-style="italic">fast · deterministic · no broker · not durable</text><rect x="660" y="100" width="460" height="220" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="676" y="126" font-size="13" fill="#a8331f" text-anchor="start" font-weight="700">Kafka connector (%prod)</text><rect x="684" y="166" width="150" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="759" y="183" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">producer JVM</text><rect x="946" y="166" width="150" height="26" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="13"/><text x="1021" y="183" font-size="11" fill="#5a3a0a" text-anchor="middle" font-weight="700">consumer JVM</text><rect x="820" y="220" width="140" height="48" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="890" y="249" font-size="11" fill="#a8331f" text-anchor="middle" font-weight="700">Kafka broker</text><line x1="759" y1="192" x2="840" y2="222" stroke="#c14a3a" stroke-width="1.4" marker-end="url(#arrR)"/><line x1="940" y1="222" x2="1021" y2="192" stroke="#c14a3a" stroke-width="1.4" marker-end="url(#arrR)"/><text x="890" y="312" font-size="10" fill="#a8331f" text-anchor="middle" font-style="italic">durable · partitioned · ordered per partition · back-pressure</text><text x="590" y="358" font-size="12" fill="#5a3a0a" text-anchor="middle" font-weight="700">same @Incoming / @Outgoing code — only the connector config changes</text><rect x="60" y="470" width="1060" height="46" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="498" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">In-memory proves the messaging logic in tests; Kafka is the real transport in %prod</text><text x="590" y="584" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Reflects how this reactor wires each connector; trade-off notes are qualitative, not benchmarked.</text></svg>