</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">The test pyramid, and the phases run-all-tests.sh walks</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">Fast and many at the base; few, heavy, and end-to-end at the top</text><rect x="260" y="140" width="240" height="92" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="276" y="192" font-size="11" fill="#7a3a0a" text-anchor="start" font-weight="700">functional (Newman) + load (hey, ghz)</text><rect x="170" y="242" width="420" height="92" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="186" y="284" font-size="11" fill="#1a3a6a" text-anchor="start" font-weight="700">failsafe *IT — OrderPlacedAvroWireIT,</text><text x="186" y="300" font-size="11" fill="#1a3a6a" text-anchor="start" font-weight="700">InventoryCheckStockWireIT (Testcontainers)</text><rect x="80" y="344" width="600" height="92" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="96" y="396" font-size="11" fill="#2a5a1a" text-anchor="start" font-weight="700">unit @QuarkusTest — surefire, Dev Services auto-provision</text><text x="760" y="122" font-size="12" fill="#5a3a0a" text-anchor="start" font-weight="700">scripts/run-all-tests.sh — phases</text><rect x="760" y="146" width="380" height="34" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="774" y="168" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">1. PREFLIGHT</text><rect x="760" y="190" width="380" height="34" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="774" y="212" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">2. UNIT + IT (mvn verify)</text><rect x="760" y="234" width="380" height="34" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="774" y="256" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">3. TWIN (Spring Boot build)</text><rect x="760" y="278" width="380" height="34" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="774" y="300" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">4. STACK-UP (docker compose)</text><rect x="760" y="322" width="380" height="34" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="774" y="344" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">5. FUNCTIONAL (Newman)</text><rect x="760" y="366" width="380" height="34" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="774" y="388" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">6. LOAD (hey / ghz)</text><rect x="760" y="410" width="380" height="34" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="774" y="432" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">7. TEARDOWN</text><rect x="40" y="560" width="1100" height="46" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="588" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">One command walks the whole pyramid — flags select tiers: --unit / --it / --load / --all</text><text x="590" y="624" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Phase names mirror scripts/run-all-tests.sh; no suite was executed to produce this figure.</text></svg>