<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 716" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="716" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">The agentic relay — Plan (Opus) → Execute (Sonnet, fan-out) → Validate (Opus)</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">A subagent's report is a claim, not evidence — validation reads the diff and runs the build itself, independent of the executor's summary</text><rect x="40" y="90" width="230" height="90" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="155" y="116" font-size="13" fill="#1a3a6a" text-anchor="middle" font-weight="700">PLAN — Opus</text><text x="56" y="138" font-size="10" fill="#3a3a3a" text-anchor="start">approach + steps +</text><text x="56" y="153" font-size="10" fill="#3a3a3a" text-anchor="start">checkable acceptance criteria</text><line x1="270" y1="135" x2="300" y2="135" stroke="#2c5aa0" stroke-width="1.8" marker-end="url(#arrB)"/><rect x="300" y="100" width="150" height="70" fill="#ffffff" stroke="#5a3a0a" stroke-width="1.5" rx="6" stroke-dasharray="5 3"/><text x="375" y="124" font-size="10.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">HUMAN GATE</text><text x="314" y="144" font-size="9" fill="#5a3a0a" text-anchor="start">approve the plan</text><text x="314" y="157" font-size="9" fill="#5a3a0a" text-anchor="start">before code is written</text><line x1="450" y1="135" x2="480" y2="135" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><text x="645" y="70" font-size="12" fill="#2a5a1a" text-anchor="middle" font-weight="700">EXECUTE — Sonnet, one agent per file-disjoint step</text><rect x="480" y="92" width="330" height="36" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="494" y="115" font-size="10.5" fill="#2a5a1a" text-anchor="start" font-weight="700">order-service</text><text x="796" y="115" font-size="8.5" fill="#666666" text-anchor="end" font-style="italic">checkpoint commit</text><rect x="480" y="136" width="330" height="36" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="494" y="159" font-size="10.5" fill="#2a5a1a" text-anchor="start" font-weight="700">inventory-service + review-service</text><text x="796" y="159" font-size="8.5" fill="#666666" text-anchor="end" font-style="italic">checkpoint commit</text><rect x="480" y="180" width="330" height="36" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="494" y="203" font-size="10.5" fill="#2a5a1a" text-anchor="start" font-weight="700">payment-service</text><text x="796" y="203" font-size="8.5" fill="#666666" text-anchor="end" font-style="italic">checkpoint commit</text><rect x="480" y="224" width="330" height="36" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="494" y="247" font-size="10.5" fill="#2a5a1a" text-anchor="start" font-weight="700">shipping-service</text><text x="796" y="247" font-size="8.5" fill="#666666" text-anchor="end" font-style="italic">checkpoint commit</text><rect x="480" y="268" width="330" height="36" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="494" y="291" font-size="10.5" fill="#2a5a1a" text-anchor="start" font-weight="700">notification-service</text><text x="796" y="291" font-size="8.5" fill="#666666" text-anchor="end" font-style="italic">checkpoint commit</text><rect x="480" y="312" width="330" height="36" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="494" y="335" font-size="10.5" fill="#2a5a1a" text-anchor="start" font-weight="700">graphql-gateway</text><text x="796" y="335" font-size="8.5" fill="#666666" text-anchor="end" font-style="italic">checkpoint commit</text><rect x="480" y="356" width="330" height="36" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="494" y="379" font-size="10.5" fill="#2a5a1a" text-anchor="start" font-weight="700">ai-mcp-service</text><text x="796" y="379" font-size="8.5" fill="#666666" text-anchor="end" font-style="italic">checkpoint commit</text><line x1="810" y1="110" x2="870" y2="135" stroke="#5a8a3a" stroke-width="1.3" marker-end="url(#arrG)"/><line x1="810" y1="154" x2="870" y2="135" stroke="#5a8a3a" stroke-width="1.3" marker-end="url(#arrG)"/><line x1="810" y1="198" x2="870" y2="135" stroke="#5a8a3a" stroke-width="1.3" marker-end="url(#arrG)"/><line x1="810" y1="242" x2="870" y2="135" stroke="#5a8a3a" stroke-width="1.3" marker-end="url(#arrG)"/><line x1="810" y1="286" x2="870" y2="135" stroke="#5a8a3a" stroke-width="1.3" marker-end="url(#arrG)"/><line x1="810" y1="330" x2="870" y2="135" stroke="#5a8a3a" stroke-width="1.3" marker-end="url(#arrG)"/><line x1="810" y1="374" x2="870" y2="135" stroke="#5a8a3a" stroke-width="1.3" marker-end="url(#arrG)"/><rect x="870" y="90" width="230" height="90" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="985" y="116" font-size="13" fill="#a8331f" text-anchor="middle" font-weight="700">VALIDATE — Opus</text><text x="886" y="138" font-size="10" fill="#3a3a3a" text-anchor="start">reads the diff and runs the</text><text x="886" y="153" font-size="10" fill="#3a3a3a" text-anchor="start">build itself, not the report</text><path d="M 985 180 C 985 482, 645 482, 645 392" fill="none" stroke="#c14a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrR)"/><text x="815" y="482" font-size="10" fill="#a8331f" text-anchor="middle" font-weight="700" font-style="italic">repair round (capped at 2): a 3rd failure means the PLAN was wrong</text><rect x="40" y="560" width="1100" height="54" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="60" y="583" font-size="9.5" fill="#8a7a5a" text-anchor="start" font-weight="700">EVERY PHASE RIDES THE SAME RAIL:</text><text x="60" y="601" font-size="11" fill="#5a3a0a" text-anchor="start" font-weight="700">branch → checkpoint commits → PR → squash-merge to main</text><rect x="40" y="632" width="1100" height="46" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="660" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">A subagent's report is a claim, not evidence — the method's value is the independent verification, not the first draft</text><text x="590" y="700" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Subagents don't inherit skills or model tier — every executor prompt restates conventions; every nested Agent call states its model explicitly.</text></svg>