</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Image build path: binary S2I inside the cluster</text><rect x="30" y="100" width="170" height="130" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="44" y="125" font-size="15" fill="#5a3a0a" text-anchor="start" font-weight="700">Host</text><text x="44" y="147" font-size="14" fill="#3a3a3a" text-anchor="start">mvn package</text><text x="44" y="166" font-size="14" fill="#3a3a3a" text-anchor="start">-Popenshift</text><text x="44" y="185" font-size="14" fill="#3a3a3a" text-anchor="start">fast-jar:</text><text x="44" y="204" font-size="14" fill="#3a3a3a" text-anchor="start">target/quarkus-app</text><line x1="200" y1="165" x2="300" y2="165" stroke="#2c5aa0" stroke-width="1.8" marker-end="url(#arrB)"/><text x="250" y="153" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">binary upload</text><rect x="300" y="62" width="850" height="232" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="316" y="88" font-size="16" fill="#5a3a0a" text-anchor="start" font-weight="700">OpenShift Local · project datamesh</text><rect x="320" y="104" width="240" height="126" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="334" y="129" font-size="15" fill="#7a3a0a" text-anchor="start" font-weight="700">BuildConfig</text><text x="334" y="151" font-size="14" fill="#3a3a3a" text-anchor="start">Source strategy, binary</text><text x="334" y="170" font-size="14" fill="#3a3a3a" text-anchor="start">S2I on</text><text x="334" y="189" font-size="14" fill="#3a3a3a" text-anchor="start">ubi10/openjdk-25:1.24-15</text><rect x="596" y="104" width="170" height="126" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="610" y="129" font-size="15" fill="#1a3a6a" text-anchor="start" font-weight="700">Internal registry</text><text x="610" y="151" font-size="14" fill="#3a3a3a" text-anchor="start">image-registry</text><text x="610" y="170" font-size="14" fill="#3a3a3a" text-anchor="start">service, port 5000</text><rect x="802" y="104" width="170" height="126" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="816" y="129" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">ImageStream</text><text x="816" y="151" font-size="14" fill="#3a3a3a" text-anchor="start">tag</text><text x="816" y="170" font-size="14" fill="#3a3a3a" text-anchor="start">&lt;service&gt;:v1</text><rect x="1004" y="104" width="130" height="126" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="1018" y="129" font-size="15" fill="#a8331f" text-anchor="start" font-weight="700">Deployment</text><text x="1018" y="151" font-size="14" fill="#3a3a3a" text-anchor="start">pulls the</text><text x="1018" y="170" font-size="14" fill="#3a3a3a" text-anchor="start">image tag</text><line x1="560" y1="167" x2="596" y2="167" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="766" y1="167" x2="802" y2="167" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="972" y1="167" x2="1004" y2="167" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#arr)"/><text x="725" y="268" font-size="14" fill="#3a3a3a" text-anchor="middle" font-weight="700">image-registry.openshift-image-registry.svc:5000/datamesh/&lt;service&gt;:v1</text><rect x="30" y="318" width="640" height="40" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="350" y="342.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">No local container engine; the cluster never pulls from Maven Central</text><rect x="700" y="324" width="450" height="28" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="14"/><text x="925" y="342.9" font-size="14" fill="#5a3a0a" text-anchor="middle" font-weight="700">x7 services, one Maven reactor run (~3 min)</text></svg>