</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">WebSockets.Next vs. the legacy WebSocket extension</text><rect x="30" y="64" width="540" height="262" fill="#fdfcfa" stroke="#9a9a9a" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="46" y="90" font-size="16" fill="#4a4a4a" text-anchor="start" font-weight="700">quarkus-websockets (legacy)</text><rect x="50" y="100" width="500" height="44" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="300" y="127" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">@ServerEndpoint("/chat")</text><rect x="50" y="154" width="500" height="44" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="300" y="181" font-size="14" fill="#3a3a3a" text-anchor="middle">Jakarta WebSocket API on Undertow</text><rect x="50" y="208" width="500" height="44" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="300" y="235" font-size="14" fill="#3a3a3a" text-anchor="middle">Callback methods take a Session parameter</text><rect x="50" y="262" width="500" height="44" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="300" y="289" font-size="14" fill="#3a3a3a" text-anchor="middle">Callback style: @OnOpen, @OnMessage, @OnClose</text><rect x="590" y="64" width="560" height="262" fill="#fdfcfa" stroke="#2c5aa0" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="606" y="90" font-size="16" fill="#1a3a6a" text-anchor="start" font-weight="700">quarkus-websockets-next (Vert.x)</text><rect x="610" y="100" width="520" height="44" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="870" y="127" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">@WebSocket(path = "/ws/notifications")</text><rect x="610" y="154" width="520" height="44" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="870" y="181" font-size="14" fill="#3a3a3a" text-anchor="middle">@OnOpen / @OnTextMessage return a value, Uni or Multi</text><rect x="610" y="208" width="520" height="44" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="870" y="235" font-size="14" fill="#3a3a3a" text-anchor="middle">Execution model follows the signature</text><rect x="610" y="262" width="520" height="44" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="870" y="289" font-size="14" fill="#3a3a3a" text-anchor="middle">Injectable OpenConnections; @WebSocketClient for clients</text><rect x="30" y="346" width="1120" height="130" fill="#fdfcfa" stroke="#5a8a3a" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="46" y="372" font-size="16" fill="#2a5a1a" text-anchor="start" font-weight="700">notification-service push path</text><rect x="50" y="384" width="290" height="52" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="195" y="415" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">@Incoming("order-placed-push")</text><rect x="380" y="384" width="270" height="52" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="515" y="415" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">OpenConnections.listAll()</text><rect x="690" y="384" width="260" height="52" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="820" y="415" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">connection.sendText(...)</text><rect x="990" y="384" width="140" height="52" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="1060" y="415" font-size="15" fill="#4a4a4a" text-anchor="middle" font-weight="700">Clients</text><line x1="340" y1="410" x2="380" y2="410" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="650" y1="410" x2="690" y2="410" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="950" y1="410" x2="990" y2="410" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><text x="590" y="460" font-size="14" fill="#666666" text-anchor="middle" font-style="italic">Per-replica consumer group: every replica receives every event and pushes to its own sockets.</text></svg>