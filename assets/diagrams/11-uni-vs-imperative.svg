</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Imperative and reactive signatures in one Quarkus service</text><rect x="30" y="64" width="540" height="340" fill="#fdfcfa" stroke="#2c5aa0" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="46" y="90" font-size="16" fill="#1a3a6a" text-anchor="start" font-weight="700">Imperative: StockResource</text><rect x="50" y="110" width="500" height="56" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="300" y="143" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">StockDto get(String sku)</text><line x1="300" y1="166" x2="300" y2="206" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="150" y="206" width="300" height="80" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="300" y="240" font-size="15" fill="#1a3a6a" text-anchor="middle" font-weight="700">Worker thread</text><text x="300" y="261" font-size="14" fill="#3a3a3a" text-anchor="middle">Blocking calls are fine</text><rect x="50" y="316" width="500" height="72" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="300" y="346" font-size="14" fill="#3a3a3a" text-anchor="middle">A plain return type runs on a worker thread</text><text x="300" y="367" font-size="14" fill="#3a3a3a" text-anchor="middle">by default in Quarkus REST</text><rect x="590" y="64" width="560" height="340" fill="#fdfcfa" stroke="#c97a3a" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="606" y="90" font-size="16" fill="#7a3a0a" text-anchor="start" font-weight="700">Reactive: InventoryGrpcService</text><rect x="610" y="110" width="520" height="56" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="870" y="143" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">Uni&lt;CheckStockResponse&gt; checkStock(req)</text><line x1="760" y1="166" x2="760" y2="206" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="610" y="206" width="300" height="80" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="760" y="240" font-size="15" fill="#7a3a0a" text-anchor="middle" font-weight="700">Event loop (Vert.x)</text><text x="760" y="261" font-size="14" fill="#3a3a3a" text-anchor="middle">Must never block</text><line x1="910" y1="246" x2="1000" y2="246" stroke="#c14a3a" stroke-width="1.6" marker-end="url(#arrR)"/><text x="955" y="232" font-size="14" fill="#666666" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">@Blocking</text><rect x="1000" y="206" width="130" height="80" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="1065" y="240" font-size="15" fill="#1a3a6a" text-anchor="middle" font-weight="700">Worker</text><text x="1065" y="261" font-size="14" fill="#3a3a3a" text-anchor="middle">thread</text><rect x="610" y="316" width="520" height="72" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="870" y="346" font-size="15" fill="#5a3a0a" text-anchor="middle" font-weight="700">Uni&lt;T&gt;: lazy, one async result, runs when subscribed</text><text x="870" y="367" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">onItem().transform()   onFailure().retry()</text><text x="590" y="442" font-size="14" fill="#6a5a3a" text-anchor="middle" font-style="italic">The signature and @Blocking / @NonBlocking (or @RunOnVirtualThread) choose the thread.</text></svg>