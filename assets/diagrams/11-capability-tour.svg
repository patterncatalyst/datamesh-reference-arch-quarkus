<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 630" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="630" fill="#ffffff"/><defs>
