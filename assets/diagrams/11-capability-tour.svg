</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Twelve Quarkus and JDK 25 capabilities, demonstrated</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">Each one runs in an endpoint, demo script or example in this project</text><rect x="20" y="64" width="180" height="160" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="32" y="88" font-size="15" fill="#1a3a6a" text-anchor="start" font-weight="700">Panache</text><text x="32" y="134" font-size="13" fill="#3a3a3a" text-anchor="start">Entity is its own</text><text x="32" y="151" font-size="13" fill="#3a3a3a" text-anchor="start">repository</text><text x="32" y="168" font-size="13" fill="#3a3a3a" text-anchor="start">(active record)</text><text x="32" y="214" font-size="12" fill="#1a3a6a" text-anchor="start" font-weight="700">order-service</text><rect x="212" y="64" width="180" height="160" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="224" y="88" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">gRPC</text><text x="224" y="134" font-size="13" fill="#3a3a3a" text-anchor="start">Typed contract</text><text x="224" y="151" font-size="13" fill="#3a3a3a" text-anchor="start">generated from .proto</text><text x="224" y="168" font-size="13" fill="#3a3a3a" text-anchor="start">at build time</text><text x="224" y="214" font-size="12" fill="#2a5a1a" text-anchor="start" font-weight="700">inventory-service</text><rect x="404" y="64" width="180" height="160" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="416" y="88" font-size="15" fill="#7a3a0a" text-anchor="start" font-weight="700">GraphQL</text><text x="416" y="134" font-size="13" fill="#3a3a3a" text-anchor="start">One query composes</text><text x="416" y="151" font-size="13" fill="#3a3a3a" text-anchor="start">REST and gRPC</text><text x="416" y="168" font-size="13" fill="#3a3a3a" text-anchor="start">downstream calls</text><text x="416" y="214" font-size="12" fill="#7a3a0a" text-anchor="start" font-weight="700">graphql-gateway</text><rect x="596" y="64" width="180" height="160" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="608" y="88" font-size="15" fill="#a8331f" text-anchor="start" font-weight="700">Reactive Messaging</text><text x="608" y="134" font-size="13" fill="#3a3a3a" text-anchor="start">Avro events via</text><text x="608" y="151" font-size="13" fill="#3a3a3a" text-anchor="start">Apicurio registry,</text><text x="608" y="168" font-size="13" fill="#3a3a3a" text-anchor="start">not raw JSON</text><text x="608" y="214" font-size="12" fill="#a8331f" text-anchor="start" font-weight="700">order-service</text><rect x="788" y="64" width="180" height="160" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="800" y="88" font-size="15" fill="#5a3a0a" text-anchor="start" font-weight="700">WebSockets.Next</text><text x="800" y="134" font-size="13" fill="#3a3a3a" text-anchor="start">Pushes committed</text><text x="800" y="151" font-size="13" fill="#3a3a3a" text-anchor="start">events to clients,</text><text x="800" y="168" font-size="13" fill="#3a3a3a" text-anchor="start">no polling</text><text x="800" y="214" font-size="12" fill="#5a3a0a" text-anchor="start" font-weight="700">notification-service</text><rect x="980" y="64" width="180" height="160" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="992" y="88" font-size="15" fill="#1a3a6a" text-anchor="start" font-weight="700">Vert.x: Uni +</text><text x="992" y="106" font-size="15" fill="#1a3a6a" text-anchor="start" font-weight="700">imperative</text><text x="992" y="134" font-size="13" fill="#3a3a3a" text-anchor="start">Reactive Uni&lt;&gt; and</text><text x="992" y="151" font-size="13" fill="#3a3a3a" text-anchor="start">classic JAX-RS side</text><text x="992" y="168" font-size="13" fill="#3a3a3a" text-anchor="start">by side</text><text x="992" y="214" font-size="12" fill="#1a3a6a" text-anchor="start" font-weight="700">inventory-service</text><rect x="20" y="238" width="180" height="160" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="32" y="262" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">Continuous testing</text><text x="32" y="280" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">+ Dev Services</text><text x="32" y="308" font-size="13" fill="#3a3a3a" text-anchor="start">Tests re-run on save;</text><text x="32" y="325" font-size="13" fill="#3a3a3a" text-anchor="start">Testcontainers</text><text x="32" y="342" font-size="13" fill="#3a3a3a" text-anchor="start">started for you</text><text x="32" y="388" font-size="12" fill="#2a5a1a" text-anchor="start" font-weight="700">order-service</text><rect x="212" y="238" width="180" height="160" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="224" y="262" font-size="15" fill="#7a3a0a" text-anchor="start" font-weight="700">Native image</text><text x="224" y="308" font-size="13" fill="#3a3a3a" text-anchor="start">Ahead-of-time compile</text><text x="224" y="325" font-size="13" fill="#3a3a3a" text-anchor="start">to a JVM-free</text><text x="224" y="342" font-size="13" fill="#3a3a3a" text-anchor="start">binary</text><text x="224" y="388" font-size="12" fill="#7a3a0a" text-anchor="start" font-weight="700">demo-native.sh</text><rect x="404" y="238" width="180" height="160" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="416" y="262" font-size="15" fill="#a8331f" text-anchor="start" font-weight="700">JDK AOT cache</text><text x="416" y="280" font-size="15" fill="#a8331f" text-anchor="start" font-weight="700">(Leyden)</text><text x="416" y="308" font-size="13" fill="#3a3a3a" text-anchor="start">Class loading and</text><text x="416" y="325" font-size="13" fill="#3a3a3a" text-anchor="start">linking cached from</text><text x="416" y="342" font-size="13" fill="#3a3a3a" text-anchor="start">a training run</text><text x="416" y="374" font-size="12" fill="#a8331f" text-anchor="start" font-weight="700">compare-quarkus-</text><text x="416" y="388" font-size="12" fill="#a8331f" text-anchor="start" font-weight="700">springboot.sh --aot</text><rect x="596" y="238" width="180" height="160" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="608" y="262" font-size="15" fill="#5a3a0a" text-anchor="start" font-weight="700">OIDC</text><text x="608" y="308" font-size="13" fill="#3a3a3a" text-anchor="start">Dev Services Keycloak,</text><text x="608" y="325" font-size="13" fill="#3a3a3a" text-anchor="start">no quarkus.oidc.*</text><text x="608" y="342" font-size="13" fill="#3a3a3a" text-anchor="start">config needed</text><text x="608" y="388" font-size="12" fill="#5a3a0a" text-anchor="start" font-weight="700">review-service</text><rect x="788" y="238" width="180" height="160" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="800" y="262" font-size="15" fill="#1a3a6a" text-anchor="start" font-weight="700">JBang</text><text x="800" y="308" font-size="13" fill="#3a3a3a" text-anchor="start">Prototype a route</text><text x="800" y="325" font-size="13" fill="#3a3a3a" text-anchor="start">with no pom.xml</text><text x="800" y="342" font-size="13" fill="#3a3a3a" text-anchor="start">or module</text><text x="800" y="388" font-size="12" fill="#1a3a6a" text-anchor="start" font-weight="700">demos/jbang</text><rect x="980" y="238" width="180" height="160" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="992" y="262" font-size="15" fill="#2a5a1a" text-anchor="start" font-weight="700">Panama FFM</text><text x="992" y="308" font-size="13" fill="#3a3a3a" text-anchor="start">Call libc from Java</text><text x="992" y="325" font-size="13" fill="#3a3a3a" text-anchor="start">without JNI</text><text x="992" y="342" font-size="13" fill="#3a3a3a" text-anchor="start">glue code</text><text x="992" y="388" font-size="12" fill="#2a5a1a" text-anchor="start" font-weight="700">demo-panama.sh</text><rect x="20" y="410" width="1140" height="38" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="433.9" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Quarkus 3.39 on JDK 25: one codebase, JVM or native</text></svg>