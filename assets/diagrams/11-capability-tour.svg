<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">A Quarkus capability tour — ten capabilities, one JVM</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">Each one demonstrated by a real endpoint or demo already running in this reactor</text><rect x="40" y="112" width="207.2" height="190" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="54" y="138" font-size="12.5" fill="#1a3a6a" text-anchor="start" font-weight="700">Panache</text><text x="54" y="172" font-size="10.5" fill="#3a3a3a" text-anchor="start">entity IS the repository</text><text x="54" y="187" font-size="10.5" fill="#3a3a3a" text-anchor="start">(active record)</text><text x="54" y="268" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="54" y="286" font-size="9.5" fill="#1a3a6a" text-anchor="start" font-weight="700">order-service — Order</text><rect x="263.2" y="112" width="207.2" height="190" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="277.2" y="138" font-size="12.5" fill="#2a5a1a" text-anchor="start" font-weight="700">quarkus-grpc</text><text x="277.2" y="172" font-size="10.5" fill="#3a3a3a" text-anchor="start">typed contract, generated</text><text x="277.2" y="187" font-size="10.5" fill="#3a3a3a" text-anchor="start">from .proto at build time</text><text x="277.2" y="268" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="277.2" y="286" font-size="9.5" fill="#2a5a1a" text-anchor="start" font-weight="700">inventory-service — CheckStock</text><rect x="486.4" y="112" width="207.2" height="190" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="500.4" y="138" font-size="12.5" fill="#7a3a0a" text-anchor="start" font-weight="700">SmallRye GraphQL</text><text x="500.4" y="172" font-size="10.5" fill="#3a3a3a" text-anchor="start">one query composes</text><text x="500.4" y="187" font-size="10.5" fill="#3a3a3a" text-anchor="start">REST + gRPC downstream</text><text x="500.4" y="268" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="500.4" y="286" font-size="9.5" fill="#7a3a0a" text-anchor="start" font-weight="700">graphql-gateway — /graphql</text><rect x="709.5999999999999" y="112" width="207.2" height="190" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="723.5999999999999" y="138" font-size="12.5" fill="#a8331f" text-anchor="start" font-weight="700">Reactive Messaging</text><text x="723.5999999999999" y="172" font-size="10.5" fill="#3a3a3a" text-anchor="start">Avro events via Apicurio,</text><text x="723.5999999999999" y="187" font-size="10.5" fill="#3a3a3a" text-anchor="start">not raw JSON</text><text x="723.5999999999999" y="268" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="723.5999999999999" y="286" font-size="9.5" fill="#a8331f" text-anchor="start" font-weight="700">order-service — OrderEventProducer</text><rect x="932.8" y="112" width="207.2" height="190" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="946.8" y="138" font-size="12.5" fill="#5a3a0a" text-anchor="start" font-weight="700">WebSockets.Next</text><text x="946.8" y="172" font-size="10.5" fill="#3a3a3a" text-anchor="start">pushes an already-</text><text x="946.8" y="187" font-size="10.5" fill="#3a3a3a" text-anchor="start">committed event, no polling</text><text x="946.8" y="268" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="946.8" y="286" font-size="9.5" fill="#5a3a0a" text-anchor="start" font-weight="700">notification-service — /ws/notifications</text><rect x="40" y="322" width="207.2" height="190" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="54" y="348" font-size="12.5" fill="#1a3a6a" text-anchor="start" font-weight="700">Vert.x: reactive + imperative</text><text x="54" y="382" font-size="10.5" fill="#3a3a3a" text-anchor="start">Uni&lt;&gt; and classic JAX-RS,</text><text x="54" y="397" font-size="10.5" fill="#3a3a3a" text-anchor="start">one reactor, same JVM</text><text x="54" y="478" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="54" y="496" font-size="9.5" fill="#1a3a6a" text-anchor="start" font-weight="700">inventory-service — gRPC + REST</text><rect x="263.2" y="322" width="207.2" height="190" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="277.2" y="348" font-size="12.5" fill="#2a5a1a" text-anchor="start" font-weight="700">Continuous testing + Dev Services</text><text x="277.2" y="382" font-size="10.5" fill="#3a3a3a" text-anchor="start">tests re-run on save;</text><text x="277.2" y="397" font-size="10.5" fill="#3a3a3a" text-anchor="start">Testcontainers auto-provisioned</text><text x="277.2" y="478" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="277.2" y="496" font-size="9.5" fill="#2a5a1a" text-anchor="start" font-weight="700">order-service — mvn quarkus:dev</text><rect x="486.4" y="322" width="207.2" height="190" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="500.4" y="348" font-size="12.5" fill="#7a3a0a" text-anchor="start" font-weight="700">Native compilation</text><text x="500.4" y="382" font-size="10.5" fill="#3a3a3a" text-anchor="start">ahead-of-time to a</text><text x="500.4" y="397" font-size="10.5" fill="#3a3a3a" text-anchor="start">JVM-free binary</text><text x="500.4" y="478" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="500.4" y="496" font-size="9.5" fill="#7a3a0a" text-anchor="start" font-weight="700">order-service — demo-native.sh</text><rect x="709.5999999999999" y="322" width="207.2" height="190" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="723.5999999999999" y="348" font-size="12.5" fill="#a8331f" text-anchor="start" font-weight="700">OIDC</text><text x="723.5999999999999" y="382" font-size="10.5" fill="#3a3a3a" text-anchor="start">Dev Services Keycloak,</text><text x="723.5999999999999" y="397" font-size="10.5" fill="#3a3a3a" text-anchor="start">zero quarkus.oidc.* config</text><text x="723.5999999999999" y="478" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="723.5999999999999" y="496" font-size="9.5" fill="#a8331f" text-anchor="start" font-weight="700">review-service — DELETE /reviews/{id}</text><rect x="932.8" y="322" width="207.2" height="190" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="946.8" y="348" font-size="12.5" fill="#5a3a0a" text-anchor="start" font-weight="700">JBang</text><text x="946.8" y="382" font-size="10.5" fill="#3a3a3a" text-anchor="start">prototype a route with</text><text x="946.8" y="397" font-size="10.5" fill="#3a3a3a" text-anchor="start">no pom.xml, no module</text><text x="946.8" y="478" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">ANCHORED TO</text><text x="946.8" y="496" font-size="9.5" fill="#5a3a0a" text-anchor="start" font-weight="700">demos/jbang/HelloRoute.java</text><rect x="40" y="532" width="1100" height="46" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="560" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">ONE JVM — the Quarkus / Vert.x reactor underneath every capability above</text><text x="590" y="614" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Breadth, not a toy snippet: every box above is a real endpoint or route already running somewhere in this reactor.</text></svg>