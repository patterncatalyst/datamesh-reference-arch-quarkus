</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Gotchas: symptoms and the fixes that landed</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">Each one cost debugging time while building this project</text><rect x="40" y="92" width="263" height="190" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="52" y="116" font-size="12" fill="#a8331f" text-anchor="start" font-weight="700">postgres:18 TimeZone</text><text x="52" y="150" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">SYMPTOM</text><text x="52" y="166" font-size="9.5" fill="#3a3a3a" text-anchor="start">'invalid value for parameter</text><text x="52" y="179" font-size="9.5" fill="#3a3a3a" text-anchor="start">TimeZone'</text><text x="52" y="224" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">FIX</text><text x="52" y="240" font-size="9.5" fill="#a8331f" text-anchor="start" font-weight="700">-Duser.timezone=UTC +</text><text x="52" y="253" font-size="9.5" fill="#a8331f" text-anchor="start" font-weight="700">TZ/PGTZ=UTC</text><rect x="319" y="92" width="263" height="190" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="331" y="116" font-size="12" fill="#7a3a0a" text-anchor="start" font-weight="700">Avro ClassSecurityValidator</text><text x="331" y="150" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">SYMPTOM</text><text x="331" y="166" font-size="9.5" fill="#3a3a3a" text-anchor="start">deserialization blocked (Avro</text><text x="331" y="179" font-size="9.5" fill="#3a3a3a" text-anchor="start">1.12)</text><text x="331" y="224" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">FIX</text><text x="331" y="240" font-size="9.5" fill="#7a3a0a" text-anchor="start" font-weight="700">org.apache.avro.SERIALIZABLE_PACKAGES</text><rect x="598" y="92" width="263" height="190" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="610" y="116" font-size="12" fill="#1a3a6a" text-anchor="start" font-weight="700">gRPC port mismatch</text><text x="610" y="150" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">SYMPTOM</text><text x="610" y="166" font-size="9.5" fill="#3a3a3a" text-anchor="start">order pinned 9001, inventory</text><text x="610" y="179" font-size="9.5" fill="#3a3a3a" text-anchor="start">9000</text><text x="610" y="224" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">FIX</text><text x="610" y="240" font-size="9.5" fill="#1a3a6a" text-anchor="start" font-weight="700">converge on</text><text x="610" y="253" font-size="9.5" fill="#1a3a6a" text-anchor="start" font-weight="700">INVENTORY_GRPC_PORT:9000</text><rect x="877" y="92" width="263" height="190" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="889" y="116" font-size="12" fill="#2a5a1a" text-anchor="start" font-weight="700">@QuarkusIntegrationTest TZ</text><text x="889" y="150" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">SYMPTOM</text><text x="889" y="166" font-size="9.5" fill="#3a3a3a" text-anchor="start">launched process ignores</text><text x="889" y="179" font-size="9.5" fill="#3a3a3a" text-anchor="start">-Duser.timezone</text><text x="889" y="224" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">FIX</text><text x="889" y="240" font-size="9.5" fill="#2a5a1a" text-anchor="start" font-weight="700">quarkus.test.arg-line=-Duser.timezone=UTC</text><rect x="40" y="306" width="263" height="190" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="52" y="330" font-size="12" fill="#5a3a0a" text-anchor="start" font-weight="700">import.sql in %prod</text><text x="52" y="364" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">SYMPTOM</text><text x="52" y="380" font-size="9.5" fill="#3a3a3a" text-anchor="start">seed data never loaded</text><text x="52" y="438" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">FIX</text><text x="52" y="454" font-size="9.5" fill="#5a3a0a" text-anchor="start" font-weight="700">self-seed via REST in @BeforeAll</text><rect x="319" y="306" width="263" height="190" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="331" y="330" font-size="12" fill="#a8331f" text-anchor="start" font-weight="700">@Consumes on bodyless GET</text><text x="331" y="364" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">SYMPTOM</text><text x="331" y="380" font-size="9.5" fill="#3a3a3a" text-anchor="start">415; RestAssured drops CT =</text><text x="331" y="393" font-size="9.5" fill="#3a3a3a" text-anchor="start">false pass</text><text x="331" y="438" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">FIX</text><text x="331" y="454" font-size="9.5" fill="#a8331f" text-anchor="start" font-weight="700">@Consumes(WILDCARD) +</text><text x="331" y="467" font-size="9.5" fill="#a8331f" text-anchor="start" font-weight="700">java.net.http test</text><rect x="598" y="306" width="263" height="190" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="610" y="330" font-size="12" fill="#7a3a0a" text-anchor="start" font-weight="700">Avro serde autodetect</text><text x="610" y="364" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">SYMPTOM</text><text x="610" y="380" font-size="9.5" fill="#3a3a3a" text-anchor="start">silent fallback to JSON on the</text><text x="610" y="393" font-size="9.5" fill="#3a3a3a" text-anchor="start">wire</text><text x="610" y="438" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">FIX</text><text x="610" y="454" font-size="9.5" fill="#7a3a0a" text-anchor="start" font-weight="700">pin value.serializer explicitly</text><rect x="877" y="306" width="263" height="190" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="889" y="330" font-size="12" fill="#1a3a6a" text-anchor="start" font-weight="700">stale postgres volume</text><text x="889" y="364" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">SYMPTOM</text><text x="889" y="380" font-size="9.5" fill="#3a3a3a" text-anchor="start">schema survives a Hibernate DDL</text><text x="889" y="393" font-size="9.5" fill="#3a3a3a" text-anchor="start">change</text><text x="889" y="438" font-size="8.5" fill="#8a7a5a" text-anchor="start" font-weight="600">FIX</text><text x="889" y="454" font-size="9.5" fill="#1a3a6a" text-anchor="start" font-weight="700">docker compose down -v to reset</text><rect x="40" y="516" width="1100" height="46" fill="#151515" stroke="#151515" stroke-width="1.5" rx="8"/><text x="590" y="544" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">Documented here so you skip the debugging — each maps to a committed fix in this repo</text><text x="590" y="684" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Symptoms and fixes are grounded in the repo's commits and config; none were re-run live for this figure.</text></svg>