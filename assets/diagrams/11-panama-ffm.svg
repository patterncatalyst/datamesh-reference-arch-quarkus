<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="400" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Panama FFM: calling libc from Java without JNI</text><rect x="30" y="64" width="860" height="150" fill="#fdfcfa" stroke="#2c5aa0" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="46" y="90" font-size="16" fill="#1a3a6a" text-anchor="start" font-weight="700">Java (JDK 25)</text><rect x="50" y="108" width="220" height="76" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="160" y="151" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">Linker.nativeLinker()</text><rect x="300" y="108" width="190" height="76" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="395" y="151" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">defaultLookup()</text><rect x="520" y="108" width="260" height="76" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="650" y="140" font-size="14" fill="#7a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">downcallHandle</text><text x="650" y="161" font-size="14" fill="#3a3a3a" text-anchor="middle">FunctionDescriptor: C signature</text><line x1="270" y1="146" x2="300" y2="146" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="490" y1="146" x2="520" y2="146" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="940" y="108" width="210" height="76" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="1045" y="140" font-size="15" fill="#2a5a1a" text-anchor="middle" font-weight="700">libc</text><text x="1045" y="161" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">getpid, strlen</text><line x1="780" y1="146" x2="940" y2="146" stroke="#5a8a3a" stroke-width="1.6" marker-end="url(#arrG)"/><text x="835" y="134" font-size="14" fill="#666666" text-anchor="middle" font-style="italic">native call</text><rect x="480" y="258" width="320" height="100" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="640" y="282" font-size="14" fill="#2a5a1a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">Arena</text><text x="640" y="302" font-size="14" fill="#3a3a3a" text-anchor="middle">allocates an off-heap MemorySegment</text><text x="640" y="322" font-size="14" fill="#3a3a3a" text-anchor="middle">holds the C string for strlen</text><text x="640" y="342" font-size="14" fill="#3a3a3a" text-anchor="middle">freed when the arena closes</text><line x1="650" y1="258" x2="650" y2="184" stroke="#5a8a3a" stroke-width="1.6" marker-end="url(#arrG)"/><text x="662" y="232" font-size="14" fill="#666666" text-anchor="start" font-style="italic">segment as argument</text><rect x="30" y="258" width="430" height="100" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="245" y="292" font-size="15" fill="#4a4a4a" text-anchor="middle" font-weight="700">JNI, for contrast</text><text x="245" y="312" font-size="14" fill="#3a3a3a" text-anchor="middle">C glue code, generated headers,</text><text x="245" y="332" font-size="14" fill="#3a3a3a" text-anchor="middle">and a separate native build</text><rect x="820" y="258" width="330" height="100" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="985" y="292" font-size="15" fill="#5a3a0a" text-anchor="middle" font-weight="700">Native access is restricted</text><text x="985" y="312" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">--enable-native-access=ALL-UNNAMED</text><text x="985" y="332" font-size="14" fill="#3a3a3a" text-anchor="middle">JDK 25 warns without it</text></svg>