<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 484" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="484" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Choreography is not orchestration: pick by who owns the sequence</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">The same order-to-shipment domain, coordinated three ways</text><rect x="270" y="62" width="290" height="46" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="415" y="92" font-size="18" fill="#a8331f" text-anchor="middle" font-weight="700">Kafka choreography</text><rect x="560" y="62" width="290" height="46" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="705" y="92" font-size="18" fill="#1a3a6a" text-anchor="middle" font-weight="700">Camel orchestration</text><rect x="850" y="62" width="290" height="46" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="995" y="92" font-size="18" fill="#2a5a1a" text-anchor="middle" font-weight="700">Quarkus Flow</text><rect x="40" y="116" width="230" height="52" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="54" y="148" font-size="16" fill="#4a4a4a" text-anchor="start" font-weight="700">Who owns the sequence</text><rect x="270" y="116" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="284" y="148" font-size="16" fill="#3a3a3a" text-anchor="start">No one</text><rect x="560" y="116" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="574" y="148" font-size="16" fill="#3a3a3a" text-anchor="start">The route</text><rect x="850" y="116" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="864" y="148" font-size="16" fill="#3a3a3a" text-anchor="start">The workflow document</text><rect x="40" y="174" width="230" height="52" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="54" y="206" font-size="16" fill="#4a4a4a" text-anchor="start" font-weight="700">Coupling</text><rect x="270" y="174" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="284" y="206" font-size="16" fill="#3a3a3a" text-anchor="start">Loose, via topics</text><rect x="560" y="174" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="574" y="206" font-size="16" fill="#3a3a3a" text-anchor="start">Central, in Java</text><rect x="850" y="174" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="864" y="206" font-size="16" fill="#3a3a3a" text-anchor="start">Central, in a document</text><rect x="40" y="232" width="230" height="52" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="54" y="264" font-size="16" fill="#4a4a4a" text-anchor="start" font-weight="700">Failure handling</text><rect x="270" y="232" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="284" y="264" font-size="16" fill="#3a3a3a" text-anchor="start">Idempotent redelivery</text><rect x="560" y="232" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="574" y="264" font-size="16" fill="#3a3a3a" text-anchor="start">Exceptions propagate</text><rect x="850" y="232" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="864" y="264" font-size="16" fill="#3a3a3a" text-anchor="start">Task-level, declarative</text><rect x="40" y="290" width="230" height="52" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="54" y="322" font-size="16" fill="#4a4a4a" text-anchor="start" font-weight="700">Debugging</text><rect x="270" y="290" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="284" y="322" font-size="16" fill="#3a3a3a" text-anchor="start">Trace across services</text><rect x="560" y="290" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="574" y="322" font-size="16" fill="#3a3a3a" text-anchor="start">One route, one log</text><rect x="850" y="290" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="864" y="322" font-size="16" fill="#3a3a3a" text-anchor="start">Inspect the task graph</text><rect x="40" y="348" width="230" height="52" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="54" y="380" font-size="16" fill="#4a4a4a" text-anchor="start" font-weight="700">Logic lives in</text><rect x="270" y="348" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="284" y="380" font-size="16" fill="#3a3a3a" text-anchor="start">Each consumer</text><rect x="560" y="348" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="574" y="380" font-size="16" fill="#3a3a3a" text-anchor="start">Route code</text><rect x="850" y="348" width="290" height="52" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="864" y="380" font-size="16" fill="#3a3a3a" text-anchor="start">Workflow definition</text><text x="590" y="468" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Kafka is choreography; Camel and Quarkus Flow are orchestration.</text></svg>