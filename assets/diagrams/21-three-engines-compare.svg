</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Choreography is not orchestration — pick by who owns the sequence</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">The same order-to-shipment domain, coordinated three ways</text><rect x="250" y="90" width="296.6666666666667" height="56" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="398.33333333333337" y="114" font-size="12" fill="#a8331f" text-anchor="middle" font-weight="700">Kafka choreography</text><text x="398.33333333333337" y="132" font-size="9.5" fill="#a8331f" text-anchor="middle" font-style="italic">no central coordinator</text><rect x="546.6666666666667" y="90" width="296.6666666666667" height="56" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="695.0000000000001" y="114" font-size="12" fill="#1a3a6a" text-anchor="middle" font-weight="700">Camel orchestration</text><text x="695.0000000000001" y="132" font-size="9.5" fill="#1a3a6a" text-anchor="middle" font-style="italic">OrderTriageRoute</text><rect x="843.3333333333334" y="90" width="296.6666666666667" height="56" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="991.6666666666667" y="114" font-size="12" fill="#2a5a1a" text-anchor="middle" font-weight="700">Quarkus Flow</text><text x="991.6666666666667" y="132" font-size="9.5" fill="#2a5a1a" text-anchor="middle" font-style="italic">OrderTriageWorkflow</text><rect x="40" y="154" width="210" height="70" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="185" font-size="10.5" fill="#4a4a4a" text-anchor="start" font-weight="700">who knows the sequence</text><rect x="250" y="154" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="262" y="185" font-size="10" fill="#3a3a3a" text-anchor="start">no one — each reacts to events</text><rect x="546.6666666666667" y="154" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="558.6666666666667" y="185" font-size="10" fill="#3a3a3a" text-anchor="start">the route, start to finish</text><rect x="843.3333333333334" y="154" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="855.3333333333334" y="185" font-size="10" fill="#3a3a3a" text-anchor="start">the workflow document</text><rect x="40" y="230" width="210" height="70" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="261" font-size="10.5" fill="#4a4a4a" text-anchor="start" font-weight="700">coupling</text><rect x="250" y="230" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="262" y="261" font-size="10" fill="#3a3a3a" text-anchor="start">loose (via topics)</text><rect x="546.6666666666667" y="230" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="558.6666666666667" y="261" font-size="10" fill="#3a3a3a" text-anchor="start">centralized in the route</text><rect x="843.3333333333334" y="230" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="855.3333333333334" y="261" font-size="10" fill="#3a3a3a" text-anchor="start">centralized in the doc</text><rect x="40" y="306" width="210" height="70" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="337" font-size="10.5" fill="#4a4a4a" text-anchor="start" font-weight="700">failure / compensation</text><rect x="250" y="306" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="262" y="337" font-size="10" fill="#3a3a3a" text-anchor="start">idempotent redelivery</text><rect x="546.6666666666667" y="306" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="558.6666666666667" y="337" font-size="10" fill="#3a3a3a" text-anchor="start">exception propagation (no saga)</text><rect x="843.3333333333334" y="306" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="855.3333333333334" y="337" font-size="10" fill="#3a3a3a" text-anchor="start">task-level, declarative</text><rect x="40" y="382" width="210" height="70" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="413" font-size="10.5" fill="#4a4a4a" text-anchor="start" font-weight="700">debuggability</text><rect x="250" y="382" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="262" y="413" font-size="10" fill="#3a3a3a" text-anchor="start">trace across services</text><rect x="546.6666666666667" y="382" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="558.6666666666667" y="413" font-size="10" fill="#3a3a3a" text-anchor="start">one route, one log</text><rect x="843.3333333333334" y="382" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="855.3333333333334" y="413" font-size="10" fill="#3a3a3a" text-anchor="start">inspect the task graph</text><rect x="40" y="458" width="210" height="70" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="52" y="489" font-size="10.5" fill="#4a4a4a" text-anchor="start" font-weight="700">where logic lives</text><rect x="250" y="458" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="262" y="489" font-size="10" fill="#3a3a3a" text-anchor="start">spread over consumers</text><rect x="546.6666666666667" y="458" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="558.6666666666667" y="489" font-size="10" fill="#3a3a3a" text-anchor="start">in Java route code</text><rect x="843.3333333333334" y="458" width="296.6666666666667" height="70" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.5" rx="6"/><text x="855.3333333333334" y="489" font-size="10" fill="#3a3a3a" text-anchor="start">in the task declaration</text><text x="590" y="624" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">Grounded in the three real implementations; terminology kept exact — Kafka is choreography, Camel and Flow are orchestration.</text></svg>