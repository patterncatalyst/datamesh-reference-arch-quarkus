<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="760" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Orchestration styles — three engines, the same order/triage domain</text><text x="590" y="51" font-size="12" fill="#666666" text-anchor="middle" font-style="italic">Kafka choreography has no coordinator; Camel and Quarkus Flow are both “orchestration”, but imperative vs. declarative</text><rect x="40" y="75" width="353.3333333333333" height="40" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="6"/><text x="216.66666666666666" y="100" font-size="12.5" fill="#a8331f" text-anchor="middle" font-weight="700">KAFKA — CHOREOGRAPHY</text><rect x="413.3333333333333" y="75" width="353.3333333333333" height="40" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="590" y="100" font-size="12.5" fill="#1a3a6a" text-anchor="middle" font-weight="700">CAMEL — ORCHESTRATION</text><rect x="786.6666666666666" y="75" width="353.3333333333333" height="40" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="963.3333333333333" y="100" font-size="12.5" fill="#2a5a1a" text-anchor="middle" font-weight="700">QUARKUS FLOW — ORCHESTRATION</text><text x="216.66666666666666" y="135" font-size="12" fill="#a8331f" text-anchor="middle" font-weight="700">NO COORDINATOR</text><text x="590" y="135" font-size="12" fill="#1a3a6a" text-anchor="middle" font-weight="700">ONE COORDINATOR — the route</text><text x="963.3333333333333" y="135" font-size="12" fill="#2a5a1a" text-anchor="middle" font-weight="700">ONE COORDINATOR — the workflow</text><rect x="50" y="158" width="333.3333333333333" height="42" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="216.66666666666666" y="184" font-size="12" fill="#5a3a0a" text-anchor="middle" font-weight="700">order-service</text><line x1="150" y1="200" x2="110" y2="238" stroke="#c14a3a" stroke-width="1.6" marker-end="url(#arrR)"/><line x1="283.3333333333333" y1="200" x2="323.3333333333333" y2="238" stroke="#c14a3a" stroke-width="1.6" marker-end="url(#arrR)"/><text x="216.66666666666666" y="218" font-size="9" fill="#666666" text-anchor="middle" font-style="italic">order.placed (Kafka)</text><rect x="50" y="242" width="158.66666666666666" height="44" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="129.33333333333331" y="265" font-size="10.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">payment-service</text><text x="129.33333333333331" y="280" font-size="9" fill="#666666" text-anchor="middle">captures payment</text><rect x="224.66666666666666" y="242" width="158.66666666666666" height="44" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="304" y="265" font-size="10" fill="#5a3a0a" text-anchor="middle" font-weight="700">notification-service</text><text x="304" y="280" font-size="8.5" fill="#666666" text-anchor="middle">a 4th, parallel reaction</text><line x1="129.33333333333331" y1="286" x2="156.66666666666666" y2="324" stroke="#c14a3a" stroke-width="1.6" marker-end="url(#arrR)"/><text x="216.66666666666666" y="306" font-size="9" fill="#666666" text-anchor="middle" font-style="italic">payment.captured</text><rect x="50" y="328" width="333.3333333333333" height="42" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="216.66666666666666" y="354" font-size="12" fill="#5a3a0a" text-anchor="middle" font-weight="700">shipping-service</text><line x1="216.66666666666666" y1="370" x2="216.66666666666666" y2="400" stroke="#c14a3a" stroke-width="1.6" marker-end="url(#arrR)"/><rect x="126.66666666666666" y="402" width="180" height="26" fill="#fdf0ec" stroke="#c14a3a" stroke-width="1.5" rx="13"/><text x="216.66666666666666" y="419" font-size="11" fill="#a8331f" text-anchor="middle" font-weight="700">shipment.dispatched</text><text x="50" y="460" font-size="10.5" fill="#3a3a3a" text-anchor="start">No service holds a reference to</text><text x="50" y="476" font-size="10.5" fill="#3a3a3a" text-anchor="start">“the whole sequence.” Each only knows:</text><text x="50" y="492" font-size="10.5" fill="#3a3a3a" text-anchor="start">when I see event X, do Y, emit Z.</text><text x="50" y="530" font-size="10.5" fill="#666666" text-anchor="start" font-style="italic">Adding a 5th reaction (say, analytics)</text><text x="50" y="546" font-size="10.5" fill="#666666" text-anchor="start" font-style="italic">costs zero changes to order-service,</text><text x="50" y="562" font-size="10.5" fill="#666666" text-anchor="start" font-style="italic">payment-service, or shipping-service.</text><rect x="480" y="158" width="220" height="26" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="13"/><text x="590" y="175" font-size="11" fill="#1a3a6a" text-anchor="middle" font-weight="700">POST /api/orders/triage</text><rect x="423.3333333333333" y="198" width="333.3333333333333" height="300" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="439.3333333333333" y="222" font-size="13" fill="#1a3a6a" text-anchor="start" font-weight="700">OrderTriageRoute</text><text x="439.3333333333333" y="240" font-size="9.5" fill="#666666" text-anchor="start" font-style="italic">imperative — one file, top to bottom</text><rect x="439.3333333333333" y="256" width="301.3333333333333" height="40" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="590" y="281" font-size="10.5" fill="#1a3a6a" text-anchor="middle" font-weight="700">unmarshal JSON → OrderCreate</text><line x1="590" y1="296" x2="590" y2="312" stroke="#2c5aa0" stroke-width="1.5" marker-end="url(#arrB)"/><rect x="439.3333333333333" y="312" width="301.3333333333333" height="40" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="590" y="337" font-size="10.5" fill="#1a3a6a" text-anchor="middle" font-weight="700">classify (TriageService, Ollama)</text><line x1="590" y1="352" x2="590" y2="368" stroke="#2c5aa0" stroke-width="1.5" marker-end="url(#arrB)"/><rect x="439.3333333333333" y="368" width="301.3333333333333" height="40" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="590" y="393" font-size="10.5" fill="#1a3a6a" text-anchor="middle" font-weight="700">decide (TriageService, Drools)</text><line x1="590" y1="408" x2="590" y2="424" stroke="#2c5aa0" stroke-width="1.5" marker-end="url(#arrB)"/><rect x="439.3333333333333" y="424" width="301.3333333333333" height="40" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="590" y="449" font-size="10.5" fill="#1a3a6a" text-anchor="middle" font-weight="700">marshal JSON → TriageDecision</text><text x="423.3333333333333" y="522" font-size="10.5" fill="#3a3a3a" text-anchor="start">Reading the route top to bottom IS</text><text x="423.3333333333333" y="538" font-size="10.5" fill="#3a3a3a" text-anchor="start">reading the business process. The</text><text x="423.3333333333333" y="554" font-size="10.5" fill="#3a3a3a" text-anchor="start">route coordinates; Drools decides.</text><rect x="838.3333333333333" y="158" width="250" height="26" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="13"/><text x="963.3333333333333" y="175" font-size="11" fill="#2a5a1a" text-anchor="middle" font-weight="700">POST /api/orders/triage-flow</text><rect x="796.6666666666666" y="198" width="333.3333333333333" height="240" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="812.6666666666666" y="222" font-size="13" fill="#2a5a1a" text-anchor="start" font-weight="700">OrderTriageWorkflow</text><text x="812.6666666666666" y="240" font-size="9.5" fill="#666666" text-anchor="start" font-style="italic">declarative — a workflow document, not code</text><rect x="812.6666666666666" y="262" width="135.66666666666666" height="50" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="880.5" y="292" font-size="10" fill="#2a5a1a" text-anchor="middle" font-weight="700">FlowDSL.function(</text><text x="880.5" y="306" font-size="10" fill="#2a5a1a" text-anchor="middle" font-weight="700">"classify")</text><line x1="953.3333333333333" y1="287" x2="973.3333333333333" y2="287" stroke="#5a8a3a" stroke-width="1.6" marker-end="url(#arrG)"/><rect x="978.3333333333333" y="262" width="135.66666666666666" height="50" fill="#ffffff" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="1046.1666666666665" y="292" font-size="10" fill="#2a5a1a" text-anchor="middle" font-weight="700">FlowDSL.function(</text><text x="1046.1666666666665" y="306" font-size="10" fill="#2a5a1a" text-anchor="middle" font-weight="700">"decide")</text><text x="812.6666666666666" y="332" font-size="9.5" fill="#666666" text-anchor="start" font-style="italic">default wiring: each task's input is</text><text x="812.6666666666666" y="346" font-size="9.5" fill="#666666" text-anchor="start" font-style="italic">the prior task's output</text><text x="812.6666666666666" y="376" font-size="10" fill="#3a3a3a" text-anchor="start">OrderTriageFlowRunner bridges back</text><text x="812.6666666666666" y="391" font-size="10" fill="#3a3a3a" text-anchor="start">to REST: startInstance(order)</text><text x="812.6666666666666" y="406" font-size="10" fill="#3a3a3a" text-anchor="start">.await().indefinitely()</text><text x="796.6666666666666" y="460" font-size="10.5" fill="#3a3a3a" text-anchor="start">Same TriageService.classify/decide</text><text x="796.6666666666666" y="476" font-size="10.5" fill="#3a3a3a" text-anchor="start">calls as the Camel route — expressed</text><text x="796.6666666666666" y="492" font-size="10.5" fill="#3a3a3a" text-anchor="start">as a task graph, not imperative code.</text><text x="796.6666666666666" y="530" font-size="10.5" fill="#666666" text-anchor="start" font-style="italic">Edit the workflow document to add a</text><text x="796.6666666666666" y="546" font-size="10.5" fill="#666666" text-anchor="start" font-style="italic">task; inspectable/versionable apart</text><text x="796.6666666666666" y="562" font-size="10.5" fill="#666666" text-anchor="start" font-style="italic">from a Java release.</text><rect x="40" y="600" width="1100" height="90" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="60" y="624" font-size="10" fill="#8a7a5a" text-anchor="start" font-weight="600">WHO KNOWS THE WHOLE SEQUENCE?</text><text x="50" y="650" font-size="10.5" fill="#3a3a3a" text-anchor="start">No one — each service knows only its own reaction</text><text x="423.3333333333333" y="650" font-size="10.5" fill="#3a3a3a" text-anchor="start">The route — read top to bottom</text><text x="796.6666666666666" y="650" font-size="10.5" fill="#3a3a3a" text-anchor="start">The workflow document — read declaratively</text><text x="590" y="744" font-size="12" fill="#6a5a3a" text-anchor="middle" font-style="italic">The three legs share a domain and a comparison; one order does not flow end to end through all three.</text></svg>