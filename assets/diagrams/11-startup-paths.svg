<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" font-family="Helvetica, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="0" y="0" width="1180" height="540" fill="#ffffff"/><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c14a3a"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a8a3a"/></marker>
</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Three startup paths for the same service</text><rect x="30" y="64" width="210" height="72" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="135" y="104" font-size="15" fill="#1a3a6a" text-anchor="middle" font-weight="700">JVM</text><rect x="270" y="64" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="367.5" y="104" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Load classes</text><rect x="501" y="64" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="598.5" y="104" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Link and verify</text><line x1="465" y1="100" x2="501" y2="100" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="732" y="64" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="829.5" y="104" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Interpret bytecode</text><line x1="696" y1="100" x2="732" y2="100" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="963" y="64" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="1060.5" y="104" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">JIT warm-up</text><line x1="927" y1="100" x2="963" y2="100" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="240" y1="100" x2="270" y2="100" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="30" y="148" width="210" height="72" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="135" y="178" font-size="15" fill="#7a3a0a" text-anchor="middle" font-weight="700">JVM + AOT cache</text><text x="135" y="198" font-size="14" fill="#3a3a3a" text-anchor="middle">JDK 25, JEPs 483/514/515</text><rect x="270" y="148" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="367.5" y="178" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Training run</text><text x="367.5" y="198" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">-XX:AOTCacheOutput</text><rect x="501" y="148" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="598.5" y="178" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">app.aot</text><text x="598.5" y="198" font-size="14" fill="#3a3a3a" text-anchor="middle">loaded, linked, profiled</text><line x1="465" y1="184" x2="501" y2="184" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="732" y="148" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="829.5" y="178" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Production run</text><text x="829.5" y="198" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">-XX:AOTCache</text><line x1="696" y1="184" x2="732" y2="184" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="963" y="148" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="1060.5" y="178" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Same jar, full JVM</text><text x="1060.5" y="198" font-size="14" fill="#3a3a3a" text-anchor="middle">JIT still active</text><line x1="927" y1="184" x2="963" y2="184" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="240" y1="184" x2="270" y2="184" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="30" y="232" width="210" height="72" fill="#e8f0e0" stroke="#5a8a3a" stroke-width="1.5" rx="6"/><text x="135" y="262" font-size="15" fill="#2a5a1a" text-anchor="middle" font-weight="700">Native image</text><text x="135" y="282" font-size="14" fill="#3a3a3a" text-anchor="middle">GraalVM / Mandrel</text><rect x="270" y="232" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="367.5" y="262" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Closed-world build</text><text x="367.5" y="282" font-size="14" fill="#3a3a3a" text-anchor="middle">static analysis</text><rect x="501" y="232" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="598.5" y="262" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Reflection config</text><text x="598.5" y="282" font-size="14" fill="#3a3a3a" text-anchor="middle">declared at build</text><line x1="465" y1="268" x2="501" y2="268" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="732" y="232" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="829.5" y="262" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Native executable</text><text x="829.5" y="282" font-size="14" fill="#3a3a3a" text-anchor="middle">no JVM, no JIT</text><line x1="696" y1="268" x2="732" y2="268" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="963" y="232" width="195" height="72" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="1060.5" y="262" font-size="14.5" fill="#5a3a0a" text-anchor="middle" font-weight="700">Runs immediately</text><text x="1060.5" y="282" font-size="14" fill="#3a3a3a" text-anchor="middle">nothing to load or link</text><line x1="927" y1="268" x2="963" y2="268" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="240" y1="268" x2="270" y2="268" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="30" y="330" width="1120" height="31" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="4"/><text x="390" y="351" font-size="15" fill="#5a3a0a" text-anchor="middle" font-weight="700">JVM</text><text x="690" y="351" font-size="15" fill="#5a3a0a" text-anchor="middle" font-weight="700">JVM + AOT cache</text><text x="995" y="351" font-size="15" fill="#5a3a0a" text-anchor="middle" font-weight="700">Native image</text><rect x="30" y="361" width="1120" height="31" fill="#ffffff" stroke="#e0ddd4" stroke-width="1" rx="0"/><text x="42" y="382" font-size="14" fill="#5a3a0a" text-anchor="start" font-weight="700">Build cost</text><text x="390" y="382" font-size="14" fill="#3a3a3a" text-anchor="middle">Compile only</text><text x="690" y="382" font-size="14" fill="#3a3a3a" text-anchor="middle">Compile + training run</text><text x="995" y="382" font-size="14" fill="#3a3a3a" text-anchor="middle">Closed-world build, minutes</text><rect x="30" y="392" width="1120" height="31" fill="#faf8f3" stroke="#e0ddd4" stroke-width="1" rx="0"/><text x="42" y="413" font-size="14" fill="#5a3a0a" text-anchor="start" font-weight="700">Startup</text><text x="390" y="413" font-size="14" fill="#3a3a3a" text-anchor="middle">Slowest: load, link, warm up</text><text x="690" y="413" font-size="14" fill="#3a3a3a" text-anchor="middle">Faster: classes pre-linked</text><text x="995" y="413" font-size="14" fill="#3a3a3a" text-anchor="middle">Fastest: no JVM start</text><rect x="30" y="423" width="1120" height="31" fill="#ffffff" stroke="#e0ddd4" stroke-width="1" rx="0"/><text x="42" y="444" font-size="14" fill="#5a3a0a" text-anchor="start" font-weight="700">Memory</text><text x="390" y="444" font-size="14" fill="#3a3a3a" text-anchor="middle">Highest</text><text x="690" y="444" font-size="14" fill="#3a3a3a" text-anchor="middle">Close to JVM</text><text x="995" y="444" font-size="14" fill="#3a3a3a" text-anchor="middle">Lowest</text><rect x="30" y="454" width="1120" height="31" fill="#faf8f3" stroke="#e0ddd4" stroke-width="1" rx="0"/><text x="42" y="475" font-size="14" fill="#5a3a0a" text-anchor="start" font-weight="700">Compatibility</text><text x="390" y="475" font-size="14" fill="#3a3a3a" text-anchor="middle">Full</text><text x="690" y="475" font-size="14" fill="#3a3a3a" text-anchor="middle">Full; cache tied to jar and JDK</text><text x="995" y="475" font-size="14" fill="#3a3a3a" text-anchor="middle">Reflection config required</text><rect x="30" y="485" width="1120" height="31" fill="#ffffff" stroke="#e0ddd4" stroke-width="1" rx="0"/><text x="42" y="506" font-size="14" fill="#5a3a0a" text-anchor="start" font-weight="700">Peak throughput</text><text x="390" y="506" font-size="14" fill="#3a3a3a" text-anchor="middle">JIT at full speed</text><text x="690" y="506" font-size="14" fill="#3a3a3a" text-anchor="middle">JIT at full speed</text><text x="995" y="506" font-size="14" fill="#3a3a3a" text-anchor="middle">No JIT: often lower peak</text></svg>