</defs><text x="590" y="32" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="700">Panache: active record vs. repository</text><rect x="30" y="64" width="440" height="262" fill="#fdfcfa" stroke="#2c5aa0" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="46" y="90" font-size="16" fill="#1a3a6a" text-anchor="start" font-weight="700">Active record (this project)</text><rect x="43" y="108" width="126" height="66" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="106" y="135" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">OrderResource</text><text x="106" y="156" font-size="14" fill="#3a3a3a" text-anchor="middle">JAX-RS</text><rect x="187" y="108" width="126" height="66" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="250" y="135" font-size="14" fill="#1a3a6a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">Order</text><text x="250" y="156" font-size="14" fill="#3a3a3a" text-anchor="middle">entity</text><rect x="331" y="108" width="126" height="66" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="394" y="135" font-size="15" fill="#4a4a4a" text-anchor="middle" font-weight="700">Database</text><text x="394" y="156" font-size="14" fill="#3a3a3a" text-anchor="middle">PostgreSQL</text><line x1="169" y1="141" x2="187" y2="141" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><line x1="313" y1="141" x2="331" y2="141" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="50" y="200" width="406" height="106" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="253" y="237" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">Order extends PanacheEntityBase</text><text x="253" y="258" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">Order.findById(id)</text><text x="253" y="279" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">order.persist()</text><rect x="490" y="64" width="660" height="262" fill="#fdfcfa" stroke="#c97a3a" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="506" y="90" font-size="16" fill="#7a3a0a" text-anchor="start" font-weight="700">Repository</text><rect x="510" y="108" width="140" height="66" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="580" y="135" font-size="14" fill="#5a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">OrderResource</text><text x="580" y="156" font-size="14" fill="#3a3a3a" text-anchor="middle">JAX-RS</text><rect x="670" y="108" width="140" height="66" fill="#fbe8d8" stroke="#c97a3a" stroke-width="1.5" rx="6"/><text x="740" y="135" font-size="14" fill="#7a3a0a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">OrderRepository</text><text x="740" y="156" font-size="14" fill="#3a3a3a" text-anchor="middle">injected bean</text><line x1="650" y1="141" x2="670" y2="141" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="830" y="108" width="140" height="66" fill="#e8eef7" stroke="#2c5aa0" stroke-width="1.5" rx="6"/><text x="900" y="135" font-size="14" fill="#1a3a6a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace" font-weight="700">Order</text><text x="900" y="156" font-size="14" fill="#3a3a3a" text-anchor="middle">entity</text><line x1="810" y1="141" x2="830" y2="141" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="990" y="108" width="140" height="66" fill="#f4f3f0" stroke="#9a9a9a" stroke-width="1.5" rx="6"/><text x="1060" y="135" font-size="15" fill="#4a4a4a" text-anchor="middle" font-weight="700">Database</text><text x="1060" y="156" font-size="14" fill="#3a3a3a" text-anchor="middle">PostgreSQL</text><line x1="970" y1="141" x2="990" y2="141" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="510" y="200" width="620" height="106" fill="#ffffff" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="820" y="237" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">OrderRepository implements PanacheRepository&lt;Order&gt;</text><text x="820" y="258" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">@Inject OrderRepository orders;</text><text x="820" y="279" font-size="14" fill="#3a3a3a" text-anchor="middle" font-family="'Red Hat Mono', ui-monospace, Menlo, Consolas, monospace">orders.findById(id)  /  orders.persist(order)</text><rect x="30" y="346" width="1120" height="74" fill="#f5edd6" stroke="#c19a6b" stroke-width="1.5" rx="6"/><text x="590" y="376" font-size="15" fill="#5a3a0a" text-anchor="middle" font-weight="700">Same Hibernate ORM and SQL underneath.</text><text x="590" y="402" font-size="14" fill="#3a3a3a" text-anchor="middle">Repository: easier to mock and layer. Active record: less code. Spring Data JPA is the twin's repository equivalent.</text></svg>