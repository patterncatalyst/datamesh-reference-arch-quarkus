# grafana-datasources.yaml — Loki, Tempo, Mimir datasources, provisioned at
# Grafana install time. The Grafana helm chart's sidecar picks this up via the
# `grafana_datasource=1` label.
#
# Mimir is registered TWICE: once as Mimir (with the Mimir UI features) and
# once as Prometheus (so PromQL queries against `prometheus` datasource still
# work — this is the "Mimir replaces Prometheus and pretends to be it" model).

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      # Mimir as the primary metrics datasource.
      - name: Mimir
        type: prometheus
        access: proxy
        url: http://mimir-nginx.observability.svc.cluster.local:80/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          prometheusType: Mimir
        secureJsonData:
          httpHeaderValue1: "anonymous"

      # Prometheus-name alias to Mimir, so dashboards that hard-code
      # `prometheus` as their datasource just work.
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://mimir-nginx.observability.svc.cluster.local:80/prometheus
        isDefault: false
        editable: false
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: "anonymous"

      # Tempo for traces.
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        editable: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: mimir
          search:
            hide: false
          nodeGraph:
            enabled: true
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -1h
            spanEndTimeShift: 1h
            tags: ["service.name", "k8s.namespace.name"]

      # Loki for logs.
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local:80
        editable: false
        jsonData:
          maxLines: 1000
