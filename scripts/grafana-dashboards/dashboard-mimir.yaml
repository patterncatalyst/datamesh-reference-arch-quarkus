# dashboard-mimir.yaml — sample Mimir / Prometheus metrics dashboard.
# Cluster-level CPU, memory, pod count, with templated namespace filter.
# A baseline for what a working Mimir install looks like; build app-specific
# dashboards on top.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mimir
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "LGTM"
data:
  mimir.json: |
    {
      "uid": "lgtm-mimir",
      "title": "Metrics (Mimir)",
      "tags": ["lgtm", "metrics", "mimir"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "mimir"},
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Pods Ready (by namespace)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "sum by (namespace) (kube_pod_status_ready{namespace=~\"$namespace\", condition=\"true\"})",
            "legendFormat": "{{namespace}}",
            "refId": "A"
          }]
        },
        {
          "id": 2,
          "title": "Container restarts (5m rate, by namespace)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{
            "expr": "sum by (namespace) (rate(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[5m]))",
            "legendFormat": "{{namespace}}",
            "refId": "A"
          }]
        },
        {
          "id": 3,
          "title": "CPU usage by pod",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}[1m]))",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }]
        },
        {
          "id": 4,
          "title": "Memory usage by pod (MiB)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "mimir"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{
            "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", container!=\"\", container!=\"POD\"}) / 1024 / 1024",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }]
        }
      ]
    }
