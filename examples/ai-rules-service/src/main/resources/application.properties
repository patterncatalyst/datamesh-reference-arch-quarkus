# LLM Provider — Ollama (local, no API key required)
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:3b
quarkus.langchain4j.ollama.base-url=http://localhost:11434
# Tool calling needs two round trips to the model, and the default 10s
# client timeout expires mid-conversation on a local CPU-bound model. This
# module only does a single-shot classify call, but the same generous
# timeout is kept to tolerate a cold/CPU-bound local model.
quarkus.langchain4j.ollama.timeout=120s

# Dev Services (tests and dev mode) starts Ollama from this image. The
# extension defaults to ollama/ollama:latest; pin a stable release instead.
# Keep in step with OLLAMA_IMAGE in .env.example.
quarkus.langchain4j.ollama.devservices.image-name=docker.io/ollama/ollama:0.40.2

# Camel REST — 8089: ai-mcp-service (the sibling DRQ-unrelated AI example)
# uses 8088, so the two modules can run side by side without a port clash.
quarkus.http.port=8089

# The ChatModel is a CDI bean supplied by quarkus-langchain4j-ollama and is
# autowired into the Camel component by type; naming it explicitly would
# require a bean of that name to exist in the registry.
