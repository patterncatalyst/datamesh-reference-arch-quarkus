spring.application.name=spring-boot-compare
spring.jpa.open-in-view=false

# -- UTC everywhere -----------------------------------------------------
# Mirrors the Quarkus side's UTC-pin crux: Postgres (Testcontainers or a
# real server) rejects legacy Olson zone ids forwarded from the host
# default, failing boot with `invalid value for parameter "TimeZone"`.
# Pin UTC for both the JDBC session and Hibernate's own timestamp handling.
# The JVM default (user.timezone) is additionally pinned via -Duser.timezone=UTC
# on the run command / Containerfile ENTRYPOINT -- see README.md.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# -- Persistence (default/dev: plain local Postgres, e.g. docker compose or
# a manually started instance on localhost; tests override this entirely
# via @ServiceConnection + Testcontainers -- see OrderControllerTest) -----
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.jpa.hibernate.ddl-auto=create-drop

# -- Kafka producer: order.placed (Avro via Apicurio) ----------
# value-serializer set explicitly (not autodetected) for parity/documentation
# with the Quarkus side, which has to set this explicitly to dodge a
# split-package autodetection bug; here it's simply the only Avro serde on
# the classpath, but being explicit keeps the two services' config diff-able.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
# apicurio.registry.url / apicurio.registry.auto-register are serializer-level
# config, not Spring Kafka properties -- they must be passed through the raw
# producer config map via spring.kafka.producer.properties.* to reach
# AvroKafkaSerializer#configure(...).
spring.kafka.producer.properties.apicurio.registry.url=${APICURIO_REGISTRY_URL:http://localhost:8080/apis/registry/v3}
spring.kafka.producer.properties.apicurio.registry.auto-register=true

# -- gRPC client: spring-boot-compare -> inventory-service ---------------
# Consumed directly via @Value("${INVENTORY_GRPC_HOST:localhost}") /
# @Value("${INVENTORY_GRPC_PORT:9000}") in GrpcClientConfig (Spring resolves
# these from the OS environment the same way Quarkus's ${ENV:default}
# property placeholders do). Documented here for discoverability -- same
# env var names and defaults as the Quarkus order-service's
# quarkus.grpc.clients.inventory.host/.port, including the canonical port
# 9000 (do NOT reintroduce 9001).
#   INVENTORY_GRPC_HOST=localhost
#   INVENTORY_GRPC_PORT=9000

# -- Ops ------------------------------------------------------------------
# spring-boot-starter-actuator exposes /actuator/health, matching the
# Quarkus side's /q/health (quarkus-smallrye-health).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

#---
spring.config.activate.on-profile=prod

# -- %prod overrides (env-driven -- same image serves compose + K8s,
# mirroring the Quarkus side's %prod.* properties) -----------------------
spring.datasource.url=${JDBC_URL:jdbc:postgresql://postgres:5432/orderdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9094}
spring.kafka.producer.properties.apicurio.registry.url=${APICURIO_REGISTRY_URL:http://apicurio:8080/apis/registry/v3}
spring.kafka.producer.properties.apicurio.registry.auto-register=true
