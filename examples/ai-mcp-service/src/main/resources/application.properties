# LLM Provider — Ollama (local, no API key required)
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5:3b
quarkus.langchain4j.ollama.base-url=http://localhost:11434
# Tool calling needs two round trips to the model, and the default 10s
# client timeout expires mid-conversation on a local CPU-bound model.
quarkus.langchain4j.ollama.timeout=120s

# Camel REST
quarkus.http.port=8088

# The ChatModel is a CDI bean supplied by quarkus-langchain4j-ollama and is
# autowired into the Camel component by type; naming it explicitly would
# require a bean of that name to exist in the registry.

# Embedded MCP server — publishes ai-tool routes to external MCP clients.
# Exposure is opt-in per tag: with no tags set nothing is published, and the
# untagged default pool is never published.
quarkus.camel.mcp-server.enabled=true
quarkus.camel.mcp-server.tags=shipping
