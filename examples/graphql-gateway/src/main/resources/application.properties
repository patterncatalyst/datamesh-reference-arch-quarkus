# GraphQL gateway: federates order-service (REST) and inventory-service (gRPC)
# behind a single /graphql endpoint. This module owns no data of its own.

# --- order-service REST client ---------------------------------------------
# order-service is still a placeholder module in this reactor (DRQ-008); once
# it ships, it must respond to GET /orders/{id} with a JSON body matching
# com.patterncatalyst.datamesh.domain.OrderDto's record components
# (orderId, customerId, itemSku, quantity, amount, status, createdAt).
quarkus.rest-client.order-service.url=${ORDER_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.order-service.connect-timeout=5000
quarkus.rest-client.order-service.read-timeout=5000

# --- inventory-service gRPC client ------------------------------------------
# Stubs are generated from capstone/inventory/v1/inventory.proto, which lives
# in the contracts module's jar (not duplicated here) and is pulled in via
# quarkus.generate-code.grpc.scan-for-proto below.
quarkus.grpc.clients.inventory.host=${INVENTORY_GRPC_HOST:localhost}
quarkus.grpc.clients.inventory.port=${INVENTORY_GRPC_PORT:9000}

quarkus.generate-code.grpc.scan-for-proto=com.patterncatalyst.datamesh:contracts

# --- GraphQL UI --------------------------------------------------------------
# GraphiQL ships enabled by default in dev/test at /q/graphql-ui; set
# explicitly here for discoverability rather than relying on the default.
%dev.quarkus.smallrye-graphql.ui.always-include=true
