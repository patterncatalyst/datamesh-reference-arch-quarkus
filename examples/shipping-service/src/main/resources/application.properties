quarkus.application.name=shipping-service

# --- Reactive Messaging / Kafka channels (DRQ-009, DRQ-010) ---------------
# Incoming: consume PaymentCaptured (Avro, capstone.payment.v1) from the
# payment.captured topic. Channel id from domain-model's Topics class.
mp.messaging.incoming.payment-captured.connector=smallrye-kafka
mp.messaging.incoming.payment-captured.topic=payment.captured
mp.messaging.incoming.payment-captured.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.payment-captured.apicurio.registry.use-specific-avro-reader=true
mp.messaging.incoming.payment-captured.enable.auto.commit=false
mp.messaging.incoming.payment-captured.auto.offset.reset=earliest

# Outgoing: produce ShipmentDispatched (Avro, capstone.shipping.v1) to the
# shipment.dispatched topic, auto-registering the schema with Apicurio the
# first time this service runs.
mp.messaging.outgoing.shipment-dispatched.connector=smallrye-kafka
mp.messaging.outgoing.shipment-dispatched.topic=shipment.dispatched
mp.messaging.outgoing.shipment-dispatched.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.shipment-dispatched.apicurio.registry.auto-register=true

# NOTE (DRQ-009): the Avro serializer/deserializer classes and
# use-specific-avro-reader are set EXPLICITLY, not left to autodetection.
# order-service empirically proved autodetection silently falls back to a
# Jackson (JSON) serializer here: two Apicurio artifacts
# (apicurio-registry-avro-serde-kafka + apicurio-registry-serde-common-avro)
# share the io.apicurio.registry.serde.avro package (SplitPackageProcessor
# warning), which breaks Quarkus serde autodetection. Explicit keys are
# required to keep events Avro on the wire.

# Kafka + Apicurio Registry Dev Services start automatically in dev/test mode
# (no bootstrap.servers / registry.url configured here).

# --- Optional local shipment record (Postgres via Dev Services) ----------
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# --- Health (smallrye-health) ---------------------------------------------
# quarkus-smallrye-health exposes /q/health, /q/health/live, /q/health/ready.
# quarkus-messaging-kafka contributes readiness checks for the configured
# Kafka channels automatically -- no custom HealthCheck needed here.
