# DataMesh :: Inventory Service

quarkus.application.name=inventory-service

# --- gRPC server ---------------------------------------------------------
# Generate the InventoryService stubs from the .proto packaged inside the
# contracts dependency jar instead of duplicating it under src/main/proto.
# See contracts/README.md ("gRPC proto" section) for the coordinates.
quarkus.generate-code.grpc.scan-for-proto=com.patterncatalyst.datamesh:contracts

# Default gRPC server port (9000) is left at its Quarkus default; set
# explicitly here for clarity/demo scripts.
quarkus.grpc.server.port=9000
quarkus.grpc.server.use-separate-server=true

# --- Persistence (Dev Services) ------------------------------------------
# No quarkus.datasource.jdbc.url is set: Dev Services for PostgreSQL starts
# an ephemeral container automatically in dev/test mode because
# quarkus-jdbc-postgresql is on the classpath.
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# --- Health ----------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
