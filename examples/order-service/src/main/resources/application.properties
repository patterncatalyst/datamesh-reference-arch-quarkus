quarkus.application.name=order-service

# ── Persistence (Panache-owned Order entity) ──────────────────────────────
# quarkus-jdbc-postgresql alone is enough for Dev Services to auto-start a
# Postgres Testcontainer in dev/test mode with zero datasource config.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ── gRPC client: order-service -> inventory-service ───────────────────────
# @GrpcClient("inventory") in InventoryClient binds to this client name.
# Host+port are env-overridable so compose/K8s can point at the real
# inventory-service (K8s Service name) without a code change; defaults suit a
# local side-by-side run. Canonical gRPC port is 9000 (inventory's server
# default) — do NOT reintroduce 9001 (the old mismatch that broke %prod/K8s).
quarkus.grpc.clients.inventory.host=${INVENTORY_GRPC_HOST:localhost}
quarkus.grpc.clients.inventory.port=${INVENTORY_GRPC_PORT:9000}

# Generate the InventoryService stub from the .proto packaged inside the
# contracts dependency jar (capstone/inventory/v1/inventory.proto) instead of
# duplicating it in this module. Verified via quarkus_searchDocs
# (grpc-generation-reference.adoc, "Proto files from dependencies") and
# contracts/README.md.
quarkus.generate-code.grpc.scan-for-proto=com.patterncatalyst.datamesh:contracts

# ── Kafka producer: order.placed (Avro via Apicurio) ─────────────
mp.messaging.outgoing.order-placed.connector=smallrye-kafka
mp.messaging.outgoing.order-placed.topic=order.placed
# Serializer autodetection (kafka.adoc, "Serializer/deserializer
# autodetection") can only pick io.apicurio.registry.serde.avro.AvroKafkaSerializer
# automatically when exactly one Avro serde is on the classpath; this build
# also pulls an older apicurio-registry-serdes-avro-serde transitively
# (confirmed via the build's own
# io.quarkus.arc.deployment.SplitPackageProcessor warning for
# io.apicurio.registry.serde.avro), which makes autodetection ambiguous and
# silently falls back to generating a Jackson (JSON) serializer instead --
# verified empirically: the unconfigured build logged "Generating Jackson
# serializer for type capstone.order.v1.OrderPlaced", which would violate
# the Avro contract. Setting value.serializer explicitly avoids that fallback.
mp.messaging.outgoing.order-placed.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.order-placed.apicurio.registry.auto-register=true

# Apicurio Schema Registry + Kafka broker are both provided by Quarkus Dev
# Services (Testcontainers) automatically in dev/test -- no
# apicurio.registry.url or kafka.bootstrap.servers needed locally. Set both
# explicitly outside dev/test (e.g. %prod profile) against the real cluster
# and registry.

# ── %prod overrides (env-driven — same image serves compose + K8s) ─
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9094}
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${APICURIO_REGISTRY_URL:http://apicurio:8080/apis/registry/v3}

%prod.quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://postgres:5432/orderdb}
%prod.quarkus.datasource.username=${DB_USERNAME:appuser}
%prod.quarkus.datasource.password=${DB_PASSWORD:apppass}
%prod.quarkus.hibernate-orm.database.generation=${DB_GENERATION:update}

# ── Dev Services image pins (wire-compat crux) — match infra/.env's
# POSTGRES_IMAGE/KAFKA_IMAGE/APICURIO_IMAGE exactly so `mvn verify`
# (Dev Services/Testcontainers) and the standalone compose stack pull the
# same broker/registry/database images.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka-native:4.2.0
quarkus.apicurio-registry.devservices.image-name=quay.io/apicurio/apicurio-registry:3.1.7
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6

# ── Ops ────────────────────────────────────────────────────────────────
# quarkus-smallrye-health exposes /q/health, /q/health/live, /q/health/ready
# with zero extra config (Reactive Messaging + datasource checks included).

# ── Structured file logging for AI-assisted diagnosis (lgtm-quarkus) ─────
# dev/test only: the packaged %prod image runs as non-root UID 185 and
# can't create/write the relative logs/ dir, which printed a non-fatal
# FileHandler.setFile stack trace at container startup. %prod stays
# console-only (stdout/stderr), per 12-factor logging.
%dev.quarkus.log.file.enable=true
%test.quarkus.log.file.enable=true
%dev.quarkus.log.file.path=logs/${quarkus.application.name}.log
%test.quarkus.log.file.path=logs/${quarkus.application.name}.log
%dev.quarkus.log.file.rotation.max-file-size=10M
%test.quarkus.log.file.rotation.max-file-size=10M
%dev.quarkus.log.file.rotation.max-backup-index=5
%test.quarkus.log.file.rotation.max-backup-index=5
%dev.quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
%test.quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
%dev.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{3.}] (%t) %s%e%n
%test.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{3.}] (%t) %s%e%n
%dev.quarkus.log.file.level=DEBUG
%test.quarkus.log.file.level=DEBUG
quarkus.log.console.level=INFO
quarkus.log.category."org.apache.kafka".level=WARN
