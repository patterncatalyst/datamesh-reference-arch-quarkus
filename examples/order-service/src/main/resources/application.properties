quarkus.application.name=order-service

# ── Persistence (Panache-owned Order entity) ──────────────────────────────
# quarkus-jdbc-postgresql alone is enough for Dev Services to auto-start a
# Postgres Testcontainer in dev/test mode with zero datasource config.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ── gRPC client: order-service -> inventory-service ───────────────────────
# @GrpcClient("inventory") in InventoryClient binds to this client name.
quarkus.grpc.clients.inventory.host=localhost
quarkus.grpc.clients.inventory.port=9001

# Generate the InventoryService stub from the .proto packaged inside the
# contracts dependency jar (capstone/inventory/v1/inventory.proto) instead of
# duplicating it in this module. Verified via quarkus_searchDocs
# (grpc-generation-reference.adoc, "Proto files from dependencies") and
# contracts/README.md.
quarkus.generate-code.grpc.scan-for-proto=com.patterncatalyst.datamesh:contracts

# ── Kafka producer: order.placed (Avro via Apicurio, DRQ-009) ─────────────
mp.messaging.outgoing.order-placed.connector=smallrye-kafka
mp.messaging.outgoing.order-placed.topic=order.placed
# Serializer autodetection (kafka.adoc, "Serializer/deserializer
# autodetection") can only pick io.apicurio.registry.serde.avro.AvroKafkaSerializer
# automatically when exactly one Avro serde is on the classpath; this build
# also pulls an older apicurio-registry-serdes-avro-serde transitively
# (confirmed via the build's own
# io.quarkus.arc.deployment.SplitPackageProcessor warning for
# io.apicurio.registry.serde.avro), which makes autodetection ambiguous and
# silently falls back to generating a Jackson (JSON) serializer instead --
# verified empirically: the unconfigured build logged "Generating Jackson
# serializer for type capstone.order.v1.OrderPlaced", which would violate
# DRQ-009. Setting value.serializer explicitly avoids that fallback.
mp.messaging.outgoing.order-placed.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
mp.messaging.outgoing.order-placed.apicurio.registry.auto-register=true

# Apicurio Schema Registry + Kafka broker are both provided by Quarkus Dev
# Services (Testcontainers) automatically in dev/test -- no
# apicurio.registry.url or kafka.bootstrap.servers needed locally. Set both
# explicitly outside dev/test (e.g. %prod profile) against the real cluster
# and registry.

# ── Ops ────────────────────────────────────────────────────────────────
# quarkus-smallrye-health exposes /q/health, /q/health/live, /q/health/ready
# with zero extra config (Reactive Messaging + datasource checks included).

# ── Structured file logging for AI-assisted diagnosis (lgtm-quarkus) ─────
quarkus.log.file.enable=true
quarkus.log.file.path=logs/${quarkus.application.name}.log
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.level=DEBUG
quarkus.log.console.level=INFO
quarkus.log.category."org.apache.kafka".level=WARN
