# DataMesh :: Payment Service
#
# Real event-driven choreography (DRQ-009, DRQ-010): every channel below is
# Avro-serialized against the Apicurio Schema Registry, never JSON. Neither
# `kafka.bootstrap.servers` nor `apicurio.registry.url` is set here so that
# Quarkus Dev Services for Kafka (quarkus-kafka-client, pulled in
# transitively by quarkus-messaging-kafka) and Dev Services for Apicurio
# Registry (quarkus-apicurio-registry-avro) both start automatically and
# wire themselves together in dev and test mode. A real deployment overrides
# these per-channel or via the connector-wide
# mp.messaging.connector.smallrye-kafka.* properties.

# --- Incoming: OrderPlaced (capstone.order.v1) <- order.placed topic ---
mp.messaging.incoming.order-placed.connector=smallrye-kafka
mp.messaging.incoming.order-placed.topic=order.placed
mp.messaging.incoming.order-placed.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
# Deserialize into the generated OrderPlaced SpecificRecord class rather than
# a schema-less GenericRecord.
mp.messaging.incoming.order-placed.apicurio.registry.use-specific-avro-reader=true

# --- Outgoing: PaymentCaptured (capstone.payment.v1) -> payment.captured topic ---
mp.messaging.outgoing.payment-captured.connector=smallrye-kafka
mp.messaging.outgoing.payment-captured.topic=payment.captured
mp.messaging.outgoing.payment-captured.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer
# Auto-register the PaymentCaptured schema with the registry on first publish.
mp.messaging.outgoing.payment-captured.apicurio.registry.auto-register=true

# ── %prod overrides (env-driven, DRQ-011 — same image serves compose + K8s) ─
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9094}
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${APICURIO_REGISTRY_URL:http://apicurio:8080/apis/registry/v3}

# ── Dev Services image pins (DRQ-011 wire-compat crux) — match infra/.env's
# KAFKA_IMAGE/APICURIO_IMAGE exactly so `mvn verify` (Dev Services/
# Testcontainers) and the standalone compose stack pull the same images.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka-native:4.2.0
quarkus.apicurio-registry.devservices.image-name=quay.io/apicurio/apicurio-registry:3.1.7
