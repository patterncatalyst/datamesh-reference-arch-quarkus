# notification-service
#
# Consumer-only data product: consumes Avro-encoded order.placed
# events from Kafka, validated against Apicurio Schema Registry, and
# persists them as Notification rows via Panache.

quarkus.application.name=notification-service

# --- Postgres (Dev Services auto-starts a container in dev/test mode) ---
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# --- Kafka: order-placed incoming channel <- order.placed topic ---
# Persistence only (see OrderPlacedConsumer). No group.id is set, so it
# defaults to quarkus.application.name ("notification-service") -- a single
# SHARED consumer group whose members split the topic's partitions among
# themselves, so across a replica set each OrderPlaced event is persisted
# by exactly one replica. Dev Services for Kafka + Apicurio Registry
# auto-start in dev/test mode (no bootstrap.servers / registry.url needed
# locally).
mp.messaging.incoming.order-placed.connector=smallrye-kafka
mp.messaging.incoming.order-placed.topic=order.placed
mp.messaging.incoming.order-placed.auto.offset.reset=earliest
# Reactive Messaging commits offsets itself once a message is processed.
mp.messaging.incoming.order-placed.enable.auto.commit=false

# Apicurio Avro deserializer. Quarkus can autodetect both of these from the
# @Incoming payload type (capstone.order.v1.OrderPlaced, an Avro
# SpecificRecord) and the presence of quarkus-apicurio-registry-avro, but
# they are set explicitly here for clarity and to pin the wire format.
mp.messaging.incoming.order-placed.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.order-placed.apicurio.registry.use-specific-avro-reader=true

# --- Kafka: order-placed-push incoming channel <- order.placed topic ---
# WebSocket fan-out only (see OrderPlacedPushConsumer); never persists.
# Same topic as order-placed above, but a per-replica UNIQUE group.id so
# Kafka treats every replica as a "group of one" and hands it a copy of
# EVERY record on every partition, instead of splitting them -- the
# multi-replica fan-out pattern from _docs/16-websocket-scaling.md.
# HOSTNAME is set by Kubernetes to the pod name for every container in a
# Deployment, which is unique per replica; the ":notification-service-push"
# default keeps this channel working (with a single, fixed group id) when
# HOSTNAME isn't present, e.g. a bare `mvn test` run outside a container --
# still correct for a single replica, since one group still sees every
# record.
mp.messaging.incoming.order-placed-push.group.id=notification-push-${HOSTNAME:notification-service-push}
mp.messaging.incoming.order-placed-push.connector=smallrye-kafka
mp.messaging.incoming.order-placed-push.topic=order.placed
mp.messaging.incoming.order-placed-push.auto.offset.reset=earliest
mp.messaging.incoming.order-placed-push.enable.auto.commit=false
mp.messaging.incoming.order-placed-push.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer
mp.messaging.incoming.order-placed-push.apicurio.registry.use-specific-avro-reader=true

# --- Health ---
quarkus.smallrye-health.ui.enable=true

# ── %prod overrides (env-driven — same image serves compose + K8s) ─
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9094}
%prod.mp.messaging.connector.smallrye-kafka.apicurio.registry.url=${APICURIO_REGISTRY_URL:http://apicurio:8080/apis/registry/v3}

%prod.quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://postgres:5432/notificationdb}
%prod.quarkus.datasource.username=${DB_USERNAME:appuser}
%prod.quarkus.datasource.password=${DB_PASSWORD:apppass}
%prod.quarkus.hibernate-orm.database.generation=${DB_GENERATION:update}

# ── Dev Services image pins (wire-compat crux) — match infra/.env's
# POSTGRES_IMAGE/KAFKA_IMAGE/APICURIO_IMAGE exactly so `mvn verify`
# (Dev Services/Testcontainers) and the standalone compose stack pull the
# same broker/registry/database images.
quarkus.kafka.devservices.image-name=docker.io/apache/kafka-native:4.3.1
quarkus.apicurio-registry.devservices.image-name=quay.io/apicurio/apicurio-registry:3.3.3
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.6
