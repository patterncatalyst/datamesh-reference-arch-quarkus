# review-service -- data product for product reviews/ratings.
# Mirrors the Python capstone's review-service: owns its own reviews table
# (per-service ownership), backed by Postgres via Hibernate ORM with Panache.

quarkus.application.name=review-service

# Postgres: Dev Services auto-starts a container in dev/test with no config
# needed (verified via quarkus_searchDocs, quarkus-hibernate-orm-panache).
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Production would use Flyway/Liquibase for schema migration; dev/test rely
# on the drop-and-create strategy above plus Dev Services.

# quarkus-smallrye-health needs no configuration: adding the dependency
# exposes /q/health, /q/health/live, /q/health/ready, /q/health/started.

# ── %prod overrides (env-driven, DRQ-011 — same image serves compose + K8s) ─
%prod.quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://postgres:5432/reviewdb}
%prod.quarkus.datasource.username=${DB_USERNAME:appuser}
%prod.quarkus.datasource.password=${DB_PASSWORD:apppass}
%prod.quarkus.hibernate-orm.database.generation=${DB_GENERATION:update}

# ── Dev Services image pin (DRQ-011 wire-compat crux) — match infra/.env's
# POSTGRES_IMAGE exactly so `mvn verify` (Dev Services/Testcontainers) and
# the standalone compose stack pull the same database image.
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18
