# ────────────────────────────────────────────────────────────────────────────
# Project: datamesh-reference-arch-quarkus
# Site identity, GitHub link target, and baseurl. Build configuration below
# generally doesn't need changes.
# ────────────────────────────────────────────────────────────────────────────

# Site identity
title: "Data Mesh Reference Architecture · Quarkus"
description: "A working data-mesh reference implementation in Quarkus — services across REST, gRPC, GraphQL, and Kafka, backed by Camel-on-Quarkus routes and langchain4j/MCP tooling, with contracts, a catalog, progressive delivery, autoscaling, and full observability. Includes a runnable Spring Boot twin service for a side-by-side comparison."
brand_emoji: "⚛️"   # Single emoji that appears next to the title in the header

# GitHub identity for header link and example sourcing
github_username: "patterncatalyst"
github_repo: "datamesh-reference-arch-quarkus"

# baseurl
# - On user/org Pages site (USERNAME.github.io): set to ""
# - On project Pages site (USERNAME.github.io/PROJECT): set to "/PROJECT"
# - For local dev override at runtime: bundle exec jekyll serve --baseurl ""
baseurl: "/datamesh-reference-arch-quarkus"

# url is set at deploy time; leave blank for GitHub Pages auto-detection
url: "https://patterncatalyst.github.io"

license: "Apache 2.0"

# ────────────────────────────────────────────────────────────────────────────
# Build configuration — generally don't change these.
# ────────────────────────────────────────────────────────────────────────────

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

# Collections
# - docs           : tutorial chapters (numbered, `tutorial` layout)
# - parts          : Part index/landing pages for the two-level docs nav
# - example_pages  : per-example write-ups (distinct from the runnable code
#                    under examples/, which is excluded from the Jekyll build)
# - plans          : plain living-document pages (decisions, build plan,
#                    reconciliation notes) — output: false, not published
#                    as standalone pages
collections:
  docs:
    output: true
    permalink: /docs/:name/
  plans:
    output: false
  example_pages:
    output: true
    permalink: /examples/:name/
  parts:
    output: true
    permalink: /parts/:name/

# Default front-matter — saves typing `layout:` on every doc.
defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: tutorial
      sectionid: docs
  - scope:
      path: ""
      type: plans
    values:
      layout: plan
  - scope:
      path: ""
      type: example_pages
    values:
      layout: tutorial
      sectionid: examples
  - scope:
      path: ""
      type: parts
    values:
      layout: part_index
      sectionid: docs

# Files that Jekyll should not process or include in the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - examples/        # runnable Quarkus/Spring Boot code, not site content
  - scripts/
  - demos/           # demo-*.sh scripts referenced from demos.html
  - presentation/
  - README.md
  - LICENSE
  - CLAUDE.md
  - PRD.md
  - _plans/archive/
